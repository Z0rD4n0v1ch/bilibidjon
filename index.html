<style>

@font-face{font-family:BiliBody;font-weight:400;font-display:swap;src:url("fonts/rubik-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:BiliBody;font-weight:500;font-display:swap;src:url("fonts/rubik-cyrillic-500-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliBody;font-weight:500;font-display:swap;src:url("fonts/rubik-latin-500-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:BiliBody;font-weight:700;font-display:swap;src:url("fonts/rubik-cyrillic-700-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliBody;font-weight:700;font-display:swap;src:url("fonts/rubik-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#DDE7E9; --tile:#9ED8C8; --tile-2:#BFE6DA; --grout:#C3CCD1;
  --surface:#FFFFFF; --ink:#14213D; --muted:#55657A;
  --cobalt:#1F4FA8; --tape:#FFC93C; --bad:#C8352E; --good:#1E8A5A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A33; --tile:#1D4A52; --tile-2:#24585F; --grout:#0A1326;
    --surface:#18284A; --ink:#EEF3F7; --muted:#A9B8CC;
    --cobalt:#7FA6F0; --tape:#FFC93C; --bad:#FF7A6E; --good:#5FD39A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A33; --tile:#1D4A52; --tile-2:#24585F; --grout:#0A1326;
  --surface:#18284A; --ink:#EEF3F7; --muted:#A9B8CC;
  --cobalt:#7FA6F0; --tape:#FFC93C; --bad:#FF7A6E; --good:#5FD39A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink); font:16px/1.5 BiliBody,Rubik,system-ui,sans-serif;
  touch-action:manipulation; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grout) 3px,transparent 3px),linear-gradient(90deg,var(--grout) 3px,transparent 3px);
  background-size:64px 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px 40px}
h1{font-family:BiliDisplay,"Russo One",Rubik,sans-serif;font-weight:400;font-size:2rem;line-height:1.05;margin:.2em 0}
h2{font-family:BiliDisplay,"Russo One",Rubik,sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 .4em}
p{margin:.4em 0}
.panel{background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:16px;margin:12px 0;box-shadow:5px 5px 0 var(--ink)}
.tape{background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#14213D 14px 28px);height:12px;border-radius:2px;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr) 44px;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0;background:var(--bg)}
.stat{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:4px 6px;text-align:center;font-size:.75rem;color:var(--muted)}
.stat b{display:block;font-size:1.05rem;color:var(--ink)}
.bar{height:6px;background:var(--grout);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
button{font:500 1rem BiliBody,Rubik,sans-serif;color:var(--ink);background:var(--tile);border:3px solid var(--ink);border-radius:4px;padding:12px 14px;width:100%;margin:6px 0;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--tape);color:#14213D;font-family:BiliDisplay,"Russo One",Rubik,sans-serif;text-align:center;font-size:1.1rem}
button small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
button.main small{color:#14213D}
button.snd{margin:0;padding:0;text-align:center;font-size:1.2rem;box-shadow:none;border-width:2px;background:var(--surface)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.quote{font-size:1.1rem;padding:10px 12px;background:var(--tile-2);border-left:6px solid var(--cobalt);border-radius:2px;margin:8px 0}
.gib{font-style:italic;color:var(--bad)}
.who{color:var(--muted);font-size:.85rem}
.log{font-size:.9rem;color:var(--muted)}
.log p{border-bottom:1px dashed var(--grout);padding:4px 0}
canvas{display:block;width:100%;touch-action:none;border:3px solid var(--ink);border-radius:4px;background:var(--grout)}
.hud{display:flex;justify-content:space-between;font-family:BiliDisplay,"Russo One",sans-serif;margin:6px 0}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.words span{background:var(--tile-2);border:2px solid var(--ink);padding:1px 8px;border-radius:2px;font-size:.85rem}
.big{font-family:BiliDisplay,"Russo One",sans-serif;font-size:2.4rem;line-height:1}
.good{color:var(--good)} .bad{color:var(--bad)}
.hero{display:flex;gap:12px;align-items:flex-end}
.hero svg{flex:0 0 96px;width:96px;height:112px}
.bubble{position:relative;background:var(--tile-2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:.95rem;margin-bottom:20px}
.bubble::after{content:"";position:absolute;left:-10px;bottom:10px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bili{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
.bili.dizzy{animation:wobble 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.owned{opacity:.6}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(10,19,38,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .panel{width:100%;max-width:380px}
.upd{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 8px);animation:up .35s ease-out}
.upd .panel{max-width:452px;margin:0 auto;border-color:var(--ink);background:var(--surface)}
.upd button{display:inline-block;width:auto;margin-right:8px}
@keyframes up{from{transform:translateY(110%)}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}.bili,.bili.dizzy{animation:none}}
.stats{grid-template-columns:repeat(4,1fr) 40px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:30;background:var(--tape);color:#14213D;border:3px solid #14213D;border-radius:4px;padding:8px 14px;font-weight:700;box-shadow:4px 4px 0 #14213D;max-width:90vw;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.row{display:flex;gap:8px}.row button{flex:1}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.ach div{border:2px solid var(--ink);border-radius:4px;padding:6px;font-size:.8rem;background:var(--tile-2)}
.ach div.locked{opacity:.4;background:var(--surface)}
.ach b{display:block;font-size:.85rem}
details summary{cursor:pointer;font-family:BiliDisplay,"Russo One",sans-serif;font-size:1.15rem}
.skills div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--grout);padding:3px 0;font-size:.9rem}
.house svg{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:4px}
.tag{display:inline-block;background:var(--tape);color:#14213D;font-size:.75rem;font-weight:700;padding:0 6px;border-radius:2px;margin-left:4px}
textarea{width:100%;min-height:90px;font:14px monospace;border:2px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);padding:6px;-webkit-user-select:text;user-select:text}
.ev{background:var(--tape);color:#14213D;padding:4px 8px;border-radius:2px;font-weight:500;font-size:.9rem}
/* --- минималистичный HUD --- */
.stats{display:flex;align-items:center;gap:clamp(8px,3vw,14px);padding:7px 6px 7px 12px;margin:6px 0 4px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:opacity .25s}
.stats.dim{opacity:.45}
.stat{all:unset;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;font:700 .95rem/1 BiliBody,Rubik,sans-serif;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stat:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:4px}
.toast{white-space:nowrap}
.stat .mini{width:clamp(22px,7vw,30px);height:5px;background:var(--grout);border-radius:3px;overflow:hidden}
.stat .mini i{display:block;height:100%;border-radius:3px}
.stat.low{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.gear{all:unset;margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:1.05rem;cursor:pointer}
.gear:active{background:var(--grout)}
.gear:focus-visible{outline:2px solid var(--cobalt)}
.hud{font:500 .9rem BiliBody,Rubik,sans-serif;color:var(--muted);margin:4px 0}
@media (prefers-reduced-motion:reduce){.stat.low{animation:none}}
</style>
</head>

const Snd = {
  ctx:null,last:{},
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
  tone(f,d,type="square",vol=.08,f2=null,delay=0,music=false){
    if(!this.ctx||!(music?S.settings.music:S.settings.sound))return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);
  },
  throttle(k,ms){const n=performance.now();if(n-(this.last[k]||0)<ms)return false;this.last[k]=n;return true;},
  click(q){this.tone(220+q*500,.09,"square",.07);if(q>.9)this.tone(1200,.06,"triangle",.05,null,.05);},
  squish(){if(this.throttle("sq",70))this.tone(140+Math.random()*60,.06,"sawtooth",.035,90);},
  roll(){if(this.throttle("rl",90))this.tone(80+Math.random()*30,.08,"triangle",.05);},
  coin(){this.tone(988,.08,"square",.06);this.tone(1319,.18,"square",.06,null,.08);},
  fail(){this.tone(160,.35,"sawtooth",.07,70);},
  ring(){[0,.18,.5,.68].forEach(d=>this.tone(1400,.12,"sine",.07,null,d));},
  nas(){this.tone(700,.5,"sine",.08,180);},
  chime(){[523,659,784].forEach((f,i)=>this.tone(f,.15,"triangle",.07,null,i*.09));},
  fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.18,"square",.06,null,i*.12));},
  splat(){this.tone(90,.15,"square",.06,50);},
  step(){if(this.throttle("st",250))this.tone(300,.05,"triangle",.04);},
  meow(){this.tone(900,.3,"sine",.06,450);},
  drill(){if(this.throttle("dr",120))this.tone(1100+Math.random()*200,.1,"sawtooth",.025);},
  cut(){if(this.throttle("ct",60))this.tone(2000+Math.random()*400,.04,"sawtooth",.015);},
};
const Music = {
  timer:null,step:0,
  bass:[110,110,147,131],
  mel:[440,0,523,587,0,659,587,523,440,0,392,440,0,523,0,0,587,0,659,784,0,659,587,0,523,0,440,392,0,440,0,0],
  start(){if(this.timer||!S.settings.music)return;Snd.init();if(!Snd.ctx)return;this.timer=setInterval(()=>this.tick(),230);},
  stop(){clearInterval(this.timer);this.timer=null;},
  tick(){if(document.hidden)return;const s=this.step++%32;
    if(s%4===0)Snd.tone(this.bass[Math.floor(s/8)],.25,"triangle",.06,null,0,true);
    if(s%4===2)Snd.tone(3000,.03,"square",.008,null,0,true);
    if(this.mel[s])Snd.tone(this.mel[s],.17,"square",.02,null,0,true);},
};

/* ================= МИНИ-ИГРЫ: общее ================= */
function speedMul(t){let m=1;if(S.nasActive)m*=1-.45*nasEff();if(S.withdraw)m*=1.45;if(S.happy<30)m*=1.25;if(S.hungry)m*=1.1;if(S.tired)m*=1.12;if(S.strong)m*=.92;if(has("laser")&&(t==="tile"||t==="wallpaper"))m*=.75;return m/skillF(t);}
function sizeMul(t){return (S.nasActive?1+.4*nasEff():1)*(S.withdraw?.8:1)*(S.happy<30?.88:1)*(S.hungry?.9:1)*(S.tired?.9:1)*(S.strong?1.1:1)*skillF(t);}
function shake(){return (S.withdraw?9:0)+(S.happy<30?5:0)+(EV.type==="drill"?6:0);}
function tm(){return CLIENTS[S.job.client].rush?.75:1}
const EV_TEXT={dark:"⚡ Отключили свет! Иногда темнеет.",drill:"🔨 Сосед сверлит. Всё трясётся.",cat:"🐈 По объекту гуляет кот заказчика."};
function renderWork(){

  EV={type:null};
  if(j.night&&Math.random()<.5)EV={type:"dark"};

  const title=j.nigora?"Полка для Нигоры":j.night?"Ночной вызов: потоп!":J.name+(j.finale?" для мамы":"")+(j.project?` · этап ${S.project.i+1}/3`:"");
  const help=j.nigora?"Полка заваливается. Держи палец с той стороны, куда она падает, пока вкручиваются саморезы.":J.help;

    <div class="panel">

      <p class="log">${help}${C.rush?" Эдик стоит над душой: времени меньше.":""}${C.crooked&&j.type==="tile"?" Арсению нужно КРИВО. Жми, когда пузырёк у краёв!":""}</p>
      ${EV.type?`<p class="ev">${EV_TEXT[EV.type]}</p>`:""}
      <div class="hud"><span id="tm">--</span><span id="sc">0%</span></div>
      <canvas id="cv"></canvas>
    </div>`;
  ({tile:tileGame,putty:puttyGame,grout:groutGame,paint:paintGame,cut:cutGame,mosaic:mosaicGame,wallpaper:wallGame,
    laminate:laminateGame,electric:electricGame,plumbing:plumbingGame,drywall:()=>drywallGame(!!j.nigora),brick:brickGame,
    courier:courierGame,sweep:sweepGame,mover:moverGame,carwash:carwashGame,warehouse:warehouseGame})[j.type]();
}
function evTick(c,w,h,t,cv){
  if(EV.type==="dark"&&(t%6)>4.4){c.fillStyle="rgba(5,8,20,.92)";c.fillRect(0,0,w,h);c.fillStyle="#FFC93C";c.font="500 16px BiliBody,Rubik,sans-serif";c.fillText("💡 Где свет?!",14,28);}
  if(EV.type==="drill"){const on=(t%3)<1.1;cv.style.transform=on?`translate(${(Math.random()-.5)*7}px,${(Math.random()-.5)*7}px)`:"";if(on)Snd.drill();}
  if(EV.type==="cat"&&t>EV.catT&&t<EV.catT+2.6){const x=-30+(w+60)*(t-EV.catT)/2.6;c.font="34px sans-serif";c.fillText("🐈",x,h*.55);
    if(!EV.catDone&&t>EV.catT+1.3){EV.catDone=true;Snd.meow();vib(80);if(EV.onCat)EV.onCat();}}
}
function setupCanvas(cv,ratio){
  const w=cv.clientWidth,h=Math.round(w*ratio),d=window.devicePixelRatio||1;
  cv.style.height=h+"px";cv.width=w*d;cv.height=h*d;
  const c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);return {c,w,h};
}
function dragInput(cv,fn,state){
  const pos=e=>{const b=cv.getBoundingClientRect(),j=shake();return [e.clientX-b.left+(Math.random()-.5)*j,e.clientY-b.top+(Math.random()-.5)*j]};
  cv.onpointerdown=e=>{state.down=true;cv.setPointerCapture(e.pointerId);[state.x,state.y]=pos(e);fn(state.x,state.y)};
  cv.onpointermove=e=>{if(!state.down)return;const [x,y]=pos(e);const n=Math.ceil(Math.hypot(x-state.x,y-state.y)/5);
    for(let s=1;s<=n;s++)fn(state.x+(x-state.x)*s/n,state.y+(y-state.y)*s/n);state.x=x;state.y=y};
  cv.onpointerup=cv.onpointercancel=()=>state.down=false;
}
let paused=false,stopCurrent=null;
function timer(T,onTick,onEnd){
  let t0=performance.now(),last=t0,stop=false;
  (function loop(now){if(stop)return;if(paused)t0+=now-last;last=now;
    if(paused){requestAnimationFrame(loop);return;}
    const el=(now-t0)/1000,left=Math.max(0,T-el);$("#tm").textContent="⏱ "+left.toFixed(1);
    if(onTick(el)===true||left<=0){stop=true;return onEnd();}requestAnimationFrame(loop);})(t0);
  stopCurrent=()=>stop=true;return stopCurrent;
}

/* ---------- плитка ---------- */
function tileGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1),crooked=CLIENTS[S.job.client].crooked;
  const cols=4,rows=4,pad=12,wallH=h-60,cw=(w-pad*2)/cols,ch=(wallH-pad*2)/rows;
  const placed=[];let flash=0,t=0,done=false,catHit=false;
  const omega=2.6*speedMul("tile")+0.1*Math.min(S.day,20);
  const off=t=>Math.sin(t*omega)*.85+Math.sin(t*omega*2.7)*.15*(S.withdraw?2:1);
  EV.onCat=()=>{if(placed.length){placed.pop();catHit=true;}};
  cv.onpointerdown=e=>{if(done)return;e.preventDefault();const o=off(t);placed.push(o);flash=1;const q=1-Math.min(1,Math.abs(o));Snd.click(crooked?1-q:q);if(!crooked&&q<.45)vib(30);};
  timer(26*tm(),tt=>{
    t=tt;$("#sc").textContent=placed.length+" / "+cols*rows;
    c.fillStyle=css("--grout");c.fillRect(0,0,w,h);
    for(let i=0;i<cols*rows;i++){
      const x=pad+(i%cols)*cw,y=pad+Math.floor(i/cols)*ch;
      if(i<placed.length){c.save();c.translate(x+cw/2,y+ch/2);c.rotate(placed[i]*.35);
        c.fillStyle=i%2?css("--tile"):css("--tile-2");c.strokeStyle=css("--ink");c.lineWidth=2;
        c.fillRect(-cw/2+3,-ch/2+3,cw-6,ch-6);c.strokeRect(-cw/2+3,-ch/2+3,cw-6,ch-6);c.restore();}
      else{c.strokeStyle=css("--muted");c.setLineDash([4,4]);c.strokeRect(x+3,y+3,cw-6,ch-6);c.setLineDash([]);}
    }
    const ly=h-42,lw=w-40;
    c.fillStyle=css("--tape");c.fillRect(20,ly,lw,28);c.strokeStyle=css("--ink");c.lineWidth=3;c.strokeRect(20,ly,lw,28);
    c.fillStyle="rgba(30,138,90,.35)";if(crooked){c.fillRect(23,ly+3,lw*.15,22);c.fillRect(17+lw*.85,ly+3,lw*.15,22);}else c.fillRect(20+lw/2-lw*.1,ly+3,lw*.2,22);
    if(has("laser")&&!crooked){c.strokeStyle="#FF2E2E";c.lineWidth=1.5;c.beginPath();c.moveTo(20+lw/2,0);c.lineTo(20+lw/2,ly);c.stroke();}
    const bx=20+lw/2+off(t)*(lw/2-14);
    c.lineWidth=3;c.strokeStyle=css("--ink");c.beginPath();c.arc(bx,ly+14,10+flash*4,0,Math.PI*2);c.fillStyle="#E8FFF5";c.fill();c.stroke();
    flash*=.85;evTick(c,w,h,t,cv);
    return placed.length>=cols*rows;
  },()=>{done=true;
    const total=cols*rows;let q=placed.reduce((a,o)=>a+(crooked?Math.min(1,Math.abs(o)/.8):1-Math.min(1,Math.abs(o))),0)/total;
    const crk=placed.filter(o=>Math.abs(o)>.55).length;let note="";
    if(catHit)note="Кот прогулялся по свежей плитке и унёс одну на лапах. ";
    if(crooked)note+=q>.7?"Арсений в восторге: «Это не криво, это концепция!»":"Арсений разочарован: «Слишком ровно. Скучно. Мейнстрим.»";
    else if(crk>3)note+=`Заказчик насчитал ${crk} кривых плиток и сказал слово, которого Билибиджон пока не знает.`;
    endJob(q,note);
  });
}
/* ---------- шпаклёвка ---------- */
function puttyGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);
  const gx=16,gy=18,cw=w/gx,chh=h/gy,cells=[];
  for(let i=0;i<gx*gy;i++)cells.push(Math.random()<.55?1:0);
  const need=cells.filter(v=>v).length,st={},r=24*sizeMul("putty")*(has("spatula")?1.35:1);
  dragInput(cv,(x,y)=>{for(let i=0;i<cells.length;i++){if(!cells[i])continue;const cx=(i%gx+.5)*cw,cy=(Math.floor(i/gx)+.5)*chh;
    if((cx-x)**2+(cy-y)**2<r*r){cells[i]=0;Snd.squish();}}},st);
  timer(Math.max(10,18-S.day*.3)*tm(),t=>{
    const remain=cells.filter(v=>v).length;$("#sc").textContent=Math.round((1-remain/need)*100)+"%";
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle=css("--muted");
    for(let i=0;i<cells.length;i++){if(!cells[i])continue;const x=(i%gx)*cw,y=Math.floor(i/gx)*chh;c.beginPath();c.ellipse(x+cw/2,y+chh/2,cw*.42,chh*.38,0,0,Math.PI*2);c.fill();}
    if(st.down){c.strokeStyle=css("--cobalt");c.lineWidth=3;c.beginPath();c.arc(st.x,st.y,r,0,Math.PI*2);c.stroke();}
    evTick(c,w,h,t,cv);return remain===0;
  },()=>{const q=1-cells.filter(v=>v).length/need;endJob(q,q<.6?"Стена всё ещё похожа на Луну. Заказчик фотографирует её для блога.":"");});
}
/* ---------- затирка ---------- */
function groutGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1);
  const n=4,g=10,ts=(w-g*(n+1))/n,pts=[],smudges=[],st={};
  const seamPos=i=>g/2+i*(ts+g);
  for(let i=1;i<n;i++){for(let p=0;p<=h;p+=7){pts.push({x:seamPos(i),y:p,f:0});pts.push({x:p,y:seamPos(i),f:0});}}
  const r=13*sizeMul("grout")*(has("float")?1.35:1),smudgeMul=has("float")?.5:1;let smudgeScore=0;
  dragInput(cv,(x,y)=>{let near=false;for(let i=1;i<n;i++){if(Math.abs(x-seamPos(i))<g/2+5||Math.abs(y-seamPos(i))<g/2+5)near=true;}
    for(const p of pts){if(!p.f&&(p.x-x)**2+(p.y-y)**2<r*r){p.f=1;Snd.squish();}}
    if(!near){smudgeScore+=smudgeMul;if(smudges.length<400&&Math.random()<.5*smudgeMul)smudges.push([x,y]);}},st);
  timer(Math.max(12,22-S.day*.3)*tm(),t=>{
    const filled=pts.filter(p=>p.f).length;$("#sc").textContent=Math.round(filled/pts.length*100)+"%";
    c.fillStyle="#3B3F46";c.fillRect(0,0,w,h);
    for(let i=0;i<n*n;i++){const x=g+(i%n)*(ts+g),y=g+Math.floor(i/n)*(ts+g);c.fillStyle=(i+Math.floor(i/n))%2?css("--tile"):css("--tile-2");c.fillRect(x,y,ts,ts);}
    c.fillStyle="#3B3F46";c.fillRect(0,0,w,g);c.fillRect(0,h-g,w,g);c.fillRect(0,0,g,h);c.fillRect(w-g,0,g,h);
    c.fillStyle="#F1F1EC";for(const p of pts)if(p.f){c.beginPath();c.arc(p.x,p.y,g/2+1,0,Math.PI*2);c.fill();}
    c.fillStyle="rgba(150,150,140,.55)";for(const [x,y] of smudges){c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();}
    if(st.down){c.strokeStyle=css("--tape");c.lineWidth=3;c.strokeRect(st.x-r,st.y-r,r*2,r*2);}
    evTick(c,w,h,t,cv);return filled===pts.length;
  },()=>{const q=pts.filter(p=>p.f).length/pts.length-Math.min(.45,smudgeScore*.003);
    endJob(q,smudgeScore>60?"Плитка теперь тоже затёрта. Вся. Заказчик назвал это «авторский стиль» и вычел из оплаты.":"");});
}
/* ---------- покраска ---------- */
function paintGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.25);
  const bucketH=56,wallH=h-bucketH,gx=14,gy=16,cw=w/gx,ch=wallH/gy,cells=[],st={};
  const forbidden=i=>{const x=i%gx,y=Math.floor(i/gx);return (x>=3&&x<=7&&y>=2&&y<=7)||(x>=10&&x<=11&&y>=11&&y<=12);};
  for(let i=0;i<gx*gy;i++)cells.push(0);
  const allowedTotal=cells.filter((_,i)=>!forbidden(i)).length,forbTotal=gx*gy-allowedTotal;
  const r=20*sizeMul("paint")*(has("roller")?1.3:1),cost=has("roller")?.8:1.25,color=PAINT_HEX[S.job.color]||"#F6B48F";
  let paint=100,warned=false;
  dragInput(cv,(x,y)=>{
    if(y>wallH){if(paint<100){paint=100;Snd.splat();}return;}
    if(paint<=0){if(!warned){Snd.fail();vib(40);warned=true;}return;}
    for(let i=0;i<cells.length;i++){if(cells[i])continue;const cx=(i%gx+.5)*cw,cy=(Math.floor(i/gx)+.5)*ch;if((cx-x)**2+(cy-y)**2<r*r){cells[i]=1;paint-=cost;Snd.roll();}}
    if(paint>0)warned=false;},st);
  timer(Math.max(13,22-S.day*.3)*tm(),t=>{
    const good=cells.filter((v,i)=>v&&!forbidden(i)).length;$("#sc").textContent=Math.round(good/allowedTotal*100)+"%";
    c.fillStyle="#D9D6CF";c.fillRect(0,0,w,wallH);

      if(forbidden(i)&&!cells[i]){c.fillStyle=(i%gx>=10)?"#FFFFFF":"#9FD3F2";c.fillRect(x,y,cw+.5,ch+.5);}

/* ================= РЕЗУЛЬТАТ ================= */
function endJob(q,note){
  q=clamp(q,0,1);const J=S.job,C=CLIENTS[J.client];let notes=[];
  if(note)notes.push(note);
  if(S.helper&&!J.finale&&!J.gig&&!J.nigora){q=Math.min(1,q+(1-q)*.25);notes.push("Фарход подправил огрехи за Билибиджоном.");}
  S.xp[J.type]=(S.xp[J.type]||0)+1+(q>.8?1:0);S.stats.jobs++;
  if(!S.stats.types.includes(J.type))S.stats.types.push(J.type);
  if(J.finale){S.won=true;S.over="win";S.result={q};Snd.fanfare();vib([80,60,80,60,200]);unlock("home");return render();}
  if(J.gig||J.nigora){
    let pay=0;
    if(J.gig){pay=Math.round(J.base*q*(1+.03*lvl(J.type)));S.happy=clamp(S.happy-5,0,100);notes.push(GIG_NOTES[J.type](q));if(J.type==="courier"&&q>=.95)unlock("pizza");}
    else{const hp=Math.round(15*Math.max(.4,q));S.happy=clamp(S.happy+hp,0,100);S.stats.nigora++;
      notes.push(q>.6?`Полка висит ровно. Нигора сказала «спасибо» и обещала плов со скидкой. Счастье +${hp}.`:`Полка висит… как-то висит. Нигора всё равно рада. Счастье +${hp}.`);if(S.stats.nigora>=3)unlock("nigora");}
    if(J.gig){const ins=inspect(.08);if(ins){notes.push(ins.t);if(!ins.ok)pay=0;}}
    S.money+=pay;S.stats.earned+=pay;
    S.result={q,pay,notes,dr:0,valeraDone:true,qDone:true,question:null,back:"evening",label:J.gig?JOBS[J.type].name:"Помощь соседке"};
    S.phase="result";q>.6?Snd.coin():Snd.fail();return render();
  }
  let pay=0,dr=0;
  if(J.project){
    S.project.scores.push(q);S.project.i++;notes.push(`Этап ${S.project.i} из 3 сделан: ${Math.round(q*100)}%.`);
    if(S.project.i>=3){const sc=S.project.scores,avg=sc.reduce((a,b)=>a+b,0)/3;
      if(Math.min(...sc)<.5){pay=Math.round(1800*.3);dr=-6;notes.push("Эдик недоволен ВСЕМ. Даже тем, что было хорошо. Заплатил 30%.");}
      else{pay=Math.round(1800*avg*(.8+S.rep/250));dr=8;notes.push(`Ремонт под ключ сдан! Эдик расчувствовался и заплатил ${pay}₽.`);unlock("edikpro");}
      S.project=null;}
    else notes.push("Эдик кивнул. Оплата — после всех этапов.");
  } else {
    pay=Math.round(J.base*C.pay*(J.rec?1.2:1)*q*(1+.04*S.words.length)*(.8+S.rep/250));
    if(C.valera&&!patentOk()){pay=Math.round(pay*.75);notes.push("Валера взял без патента, но «за риск» срезал четверть оплаты.");}
    const room=/\{(ванная|кухня)\}/.exec(J.text||"");
    if(room&&!S.words.includes(room[1])&&Math.random()<.35){pay=Math.round(pay*.5);notes.push(`Билибиджон всё сделал отлично. Только не в той комнате (заказчик говорил «${room[1]}»).`);}
    if(C.rush){if(q>=.8)unlock("edik");if(q<.5){pay=Math.round(pay*.5);notes.push("Эдику не понравилось. Он заплатил половину и купил себе ещё одну яхту.");}else notes.push("Эдик доволен и щедр. Почти как в кино.");}
    if(C.pies){S.happy=clamp(S.happy+12,0,100);S.stats.pies++;if(!S.ate)S.ate="pies";notes.push("Бабушка Зина доплатила пирожками. Ужин есть, счастье +12.");}
    if(C.crooked&&J.type==="tile"&&q>.7)unlock("hipster");
    dr=(q-.55)*16*(C.blog?3:1);
    if(C.blog){if(q>.75){notes.push("Ролик «Плиточник от бога» набрал миллион просмотров!");unlock("viral");}else if(q<.45)notes.push("Ролик «Худший ремонт года» в трендах. Ой.");}
    if(J.night){S.nightPending=true;dr=Math.max(dr,2);notes.push(q>.6?"Потоп остановлен в 3:40 ночи. Соседи снизу прислали торт.":"Вода остановилась сама. Когда кончилась.");if(q>.6)unlock("night");}
    if(J.type==="tile"&&!C.crooked&&q>=.97)unlock("perfect");
    if(q>.9)notes.push("Работа идеальная. Заказчик сказал «спасибо» и что-то ещё, очень длинное.");
  }
  S.rep=clamp(S.rep+dr,0,100);
  if(!J.night){const ins=inspect(C.valera?.25:.18);if(ins){notes.push(ins.t);if(!ins.ok)pay=0;}}
  let valera=0;if(C.valera&&pay>0&&Math.random()<.45){valera=Math.round(pay*.4);pay-=valera;}
  S.money+=pay;S.stats.earned+=pay;
  const ask=!C.valera&&!J.night&&!J.project&&Math.random()<.45;
  S.result={q,pay,notes,dr,valera,valeraDone:!valera,question:ask?Math.floor(Math.random()*QUESTIONS.length):null,qText:null,back:J.night?"sleep":null,label:J.night?"Ночной вызов":null};
  S.result.qDone=S.result.question===null;
  S.phase="result";q>.6?Snd.coin():(Snd.fail(),vib(150));
  render();
}
function renderResult(){
  const r=S.result;
  const line=r.q>.85?"Ровно как по лазеру!":r.q>.6?"Нормально. Мама бы похвалила.":r.q>.35?"Никто не заметит. Наверное.":"Это был эксперимент.";
  let extra="";
  if(!r.valeraDone)extra+=`<div class="panel"><h2>Валера хитрит</h2><p>Прораб Валера говорит, что ${r.valera}₽ отдаст «потом». «Потом» у Валеры не наступает никогда.</p>

function queueGame(){
  $("#screen").innerHTML=`<div class="panel"><h2>🏢 Очередь</h2><p class="log">Очередь ползёт к окну. Тапай по тем, кто лезет «только спросить», — иначе тебя отодвинут назад.</p>
    <div class="hud"><span id="tm">--</span><span id="sc"></span></div><canvas id="cv"></canvas></div>`;
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,.85),sp=speedMul("queue");
  let pos=8,cut=[],nextCut=1,nextAdv=1.5,t=0,joke=rnd(WINDOW_JOKES),blocked=0;
  const gap=Math.min(32,(w-110)/11),slotX=i=>w-72-i*gap,qy=h*.7;
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    for(const k of cut)if(!k.done&&Math.hypot(k.x-x,k.y-y)<46){k.done=1;blocked++;Snd.click(1);joke="Билибиджон: «Я тут стоял!»";return;}};
  timer(16,tt=>{t=tt;
    if(t>nextAdv&&pos>0){pos--;nextAdv=t+1.5;Snd.step();}
    if(t>nextCut&&pos>1){const sx=20+Math.random()*(w-130);cut.push({sx,sy:24,x:sx,y:24,t0:t,dur:1.4/sp});nextCut=t+1.1+Math.random()*1.2;}
    for(const k of cut){if(k.done)continue;const p=(t-k.t0)/k.dur,tx=slotX(Math.max(0,pos-1));k.x=k.sx+(tx-k.sx)*p;k.y=k.sy+(qy-k.sy)*p;
      if(p>=1){k.done=1;pos=Math.min(10,pos+1);Snd.fail();vib(50);joke="«Я только спросить!» — и встал перед тобой.";}}
    cut=cut.filter(k=>!k.done);$("#sc").textContent="перед тобой: "+pos;
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle=css("--grout");c.fillRect(0,qy+18,w,h);
    c.fillStyle="#9FD3F2";c.fillRect(w-54,qy-70,44,60);c.strokeStyle=css("--ink");c.lineWidth=3;c.strokeRect(w-54,qy-70,44,60);
    c.fillStyle=css("--ink");c.font="500 12px BiliBody,Rubik,sans-serif";c.fillText("Окно 3",w-54,qy-76);
    c.font="26px sans-serif";c.textAlign="center";
    for(let i=0;i<pos;i++)c.fillText("🧍",slotX(i),qy+10);
    c.fillText("👷",slotX(pos),qy+10);for(let i=pos+1;i<pos+4;i++)c.fillText("🧍",slotX(i),qy+10);
    for(const k of cut)c.fillText("🙋",k.x,k.y+10);c.textAlign="start";
    c.fillStyle=css("--ink");c.font="500 15px BiliBody,Rubik,sans-serif";c.fillText(joke,12,22);
    return pos===0;
  },()=>{const q=clamp(1-pos/8,0,1),M=S.mig;M.queued=true;M.windows=q>=.7?3:q>=.4?2:1;if(pos===0&&blocked>=3)unlock("window3");
    M.log.unshift(pos===0?`Дошёл до окна! Отбил ${blocked} «только спросить». Окон сегодня: ${M.windows}.`:`Окно закрылось на «технический перерыв». Успеешь только в ${M.windows} ${M.windows===1?"окно":"окна"}.`);render();});
}

      :`<p class="log">Земляк Фарход ищет работу. Будет исправлять четверть твоих ошибок.</p><button id="hire" ${S.money<150||S.rep<25?"disabled":""}>👷 Нанять Фарходa <small>150₽ сразу + 70₽ в день${S.rep<25?" · нужна репутация 25":""}</small></button>`}
    </div>
    <div class="panel skills"><h2>Профессии и навыки</h2>${Object.entries(JOBS).map(([k,j])=>`<div><span>${j.gig?GIG_E[k]+" ":""}${j.name}</span><span>${unlocked(k)?"★".repeat(lvl(k))+"☆".repeat(5-lvl(k)):"🔒 "+reqText(k)}</span></div>`).join("")}
      <p class="log">Каждые 3 заказа — новая звезда: работа даётся легче.</p></div>
    <div class="panel"><h2>Строительный рынок</h2>
      <p class="log">Дядя Ашот продаёт инструменты. Говорит, что со скидкой. Скидки никто не видел.</p>
      ${TOOLS.map(t=>`<button data-t="${t.id}" class="${has(t.id)?'owned':''}" ${has(t.id)||S.money<t.price?"disabled":""}>${t.e} ${t.name} <small>${has(t.id)?"Уже куплено":t.price+"₽ · "+t.desc}</small></button>`).join("")}
    </div>
    <div class="panel"><details><summary>Ачивки ${S.ach.length} / ${Object.keys(ACH).length}</summary><div class="ach" style="margin-top:8px">
      ${Object.entries(ACH).map(([k,a])=>`<div class="${S.ach.includes(k)?'':'locked'}">${a[0]}<b>${a[1]}</b>${a[2]}</div>`).join("")}</div></details></div>
    ${S.words.length?`<div class="panel"><div class="who">Словарь Билибиджона</div><div class="words">${S.words.map(w=>`<span>${w}</span>`).join("")}</div></div>`:""}`;
  $("#call").onclick=()=>{S.money-=callCost;S.happy=clamp(S.happy+30,0,100);S.called=true;S.stats.calls++;Snd.ring();
    if(!S.quest&&S.day>=3&&Math.random()<.4){const q=rnd(QUESTS);S.quest={text:q.text,need:q.need,deadline:S.day+q.days};S.log.unshift(`Мама: «Сынок, тут такое дело… ${q.text.toLowerCase()}». Нужно ${q.need}₽ до ${S.quest.deadline}-го дня.`);}
    else S.log.unshift(rnd(CALLS));render();};
  if(S.quest)$("#quest").onclick=()=>{S.money-=S.quest.need;S.happy=clamp(S.happy+25,0,100);S.log.unshift(`Деньги ушли: «${S.quest.text}». Вся родня звонит по очереди и благодарит.`);S.quest=null;unlock("quest");Snd.fanfare();render();};
  $("#send1").onclick=()=>sendHome(100);$("#send5").onclick=()=>sendHome(500);
  $("#nas").onclick=()=>{S.money-=40;S.nasBought=true;S.tol++;S.log.unshift(S.tol>4?"Продавец насвая узнаёт Билибиджона по шагам.":"Насвай куплен. Завтра будет продуктивно.");Snd.nas();render()};
  $("#learn").onclick=()=>{const w=unknown[0];S.words.push(w);S.learned=true;S.log.unshift(`Новое слово: «${w}». Билибиджон повторил его 200 раз. Сосед попросил перестать.`);Snd.chime();render()};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const f=FOOD.find(x=>x.id===b.dataset.f);S.money-=foodPrice(f);S.ate=f.id;S.happy=clamp(S.happy+f.h,0,100);S.log.unshift(`${f.e} ${f.name}. ${f.id==="dosh"?"Классика жанра.":f.id==="plov"?"Нигора положила добавку. Это любовь? Это плов.":"Шашлык! Билибиджон чувствует себя Эдиком."}`);Snd.coin();render();});
  if(S.helper)$("#fire").onclick=()=>{S.helper=false;S.log.unshift("Фарход ушёл. На прощание оставил свой шпатель и анекдот.");render();};
  else $("#hire").onclick=()=>{S.money-=150;S.helper=true;S.log.unshift("Фарход в бригаде! Первым делом он позвонил маме и рассказал, что теперь работает «в компании».");unlock("brigade");Snd.coin();render();};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=TOOLS.find(x=>x.id===b.dataset.t);S.money-=t.price;S.tools.push(t.id);S.log.unshift(`Куплено: ${t.name}. Билибиджон спит с ним в обнимку.`);Snd.coin();render();});
  const g=$("#gig");if(g)g.onclick=()=>{const opts=Object.keys(JOBS).filter(k=>JOBS[k].gig).sort(()=>Math.random()-.5).slice(0,2);
    showDialog("Подработка","<p class='log'>Сегодня есть такие варианты:</p>",[...opts.map(k=>[`${GIG_E[k]} ${JOBS[k].name} · до ${JOBS[k].base}₽`,()=>{closeDialog();S.eve.gig=true;startJob({type:k,client:"gig",gig:true,base:JOBS[k].base,text:""});}]),["Не сегодня",closeDialog]]);};
  const rg=$("#reg");if(rg)rg.onclick=()=>{S.money-=40;S.docs.reg=Math.max(S.docs.reg,S.day-1)+15;S.log.unshift("🏠 "+rnd(["Комендант поставил печать и рассказал про своего кота.","Регистрация продлена. Комендант попросил заодно починить кран.","Комендант долго искал ручку. Нашёл. Печать стоит."]));Snd.coin();render();};
  const bk=$("#bkFile");if(bk){bk.onclick=async()=>{await exportFile();render();};$("#bkLater").onclick=()=>{S.backupSnooze=S.day+2;render();};}
  const ng=$("#nig");if(ng)ng.onclick=()=>{S.eve.nigora=false;startJob({type:"drywall",client:"nigora",nigora:true,base:0,text:""});};
  $("#sleep").onclick=()=>{if(S.eve.night){S.eve.night=false;Snd.ring();vib([200,100,200]);
    showDialog("📞 3:00 ночи","<p>Звонит незнакомый номер: «Прорвало трубу! Вода везде! Плачу вдвое!»</p><p class='log'>Утром Билибиджон будет невыспавшимся.</p>",[
      ["Поехать (×2 оплата)",()=>{closeDialog();startJob({type:"plumbing",client:"night",night:true,base:JOBS.plumbing.base*2,text:""});}],
      ["Спать дальше",()=>{closeDialog();sleep();}]]);}else sleep();};
}
function sleep(){
  S.money-=110+(S.helper?70:0);
  S.happy-=(has("headphones")?8:14)+(S.called?0:6);
  S.hungry=!S.ate;if(S.hungry)S.happy-=10;
  S.strong=S.ate==="shash";S.ate=null;
  S.withdraw=S.nasActive&&!S.nasBought;
  S.nasStreak=S.nasBought?S.nasStreak+1:0;if(S.nasStreak>=5)unlock("nas5");
  if(!S.nasBought&&!S.nasActive&&S.tol>0)S.tol=Math.max(0,S.tol-1);
  S.nasActive=S.nasBought;S.nasBought=false;S.called=false;S.learned=false;
  S.tired=!!S.nightPending;S.nightPending=false;S.eve={};
  S.day++;S.offers=null;S.phase="morning";S.mnotes=[];
  if(S.quest&&S.day>S.quest.deadline){S.happy-=25;S.mnotes.push(`Не успел: «${S.quest.text}». Мама сказала «ничего, сынок». От этого ещё хуже.`);S.quest=null;}
  S.happy=clamp(S.happy,0,100);
  if(S.strikes>=3)S.over="deported";else if(S.money<0)S.over="broke";else if(S.happy<=0)S.over="sad";
  Snd.tone(330,.4,"sine",.05,220);
  render();
}

/* ================= КОНЦОВКИ И РЕКОРДЫ ================= */
function getRecords(){try{return JSON.parse(localStorage.getItem("bili_records")||"[]")}catch(e){return []}}
function addRecord(){if(S.recorded)return;S.recorded=true;const r=getRecords();r.push({days:S.day,words:S.words.length,ach:S.ach.length,date:new Date().toLocaleDateString("ru-RU")});
  r.sort((a,b)=>a.days-b.days);try{localStorage.setItem("bili_records",JSON.stringify(r.slice(0,10)))}catch(e){}}
function recordsHtml(){const r=getRecords();return r.length?`<div class="skills">${r.slice(0,5).map((x,i)=>`<div><span>${["🥇","🥈","🥉","4.","5."][i]} ${x.days} дн.</span><span class="log">${x.date} · ${x.ach} ачивок</span></div>`).join("")}</div>`:'<p class="log">Рекордов пока нет. Построй дом маме!</p>';}
function renderOver(){
  if(S.over==="win")addRecord();
  const t={
    win:["Дом построен!",`Билибиджон положил плитку в маминой ванной${S.result&&S.result.q>.8?" — идеально ровно":" — почти ровно, но мама сказала, что идеально"}. Кот толстеет, бабушка рассказывает всем про сына-плиточника.`],
    broke:["Денег нет","Билибиджон ночует на объекте, обнимая мешок шпаклёвки. Мешок тёплый, но это не жизнь."],
    deported:["Билибиджона отправили домой","Три нарушения — и Билибиджон летит домой. Мама встречает в аэропорту с пловом и говорит: «Документы надо было продлевать, сынок». В следующий раз — обязательно."],
    sad:["Билибиджон уехал домой","Слишком долго без звонков. Он купил билет на последние деньги и прямо в аэропорту позвонил маме."]
  }[S.over];
  $("#screen").innerHTML=`<div class="panel"><h1>${t[0]}</h1><div class="tape"></div>${S.over==="win"?`<div class="house">${house(5)}</div>`:`<div class="hero">${sprite("sad")}</div>`}<p>${t[1]}</p>
    <p class="log">Дней: ${S.day}. Отправлено домой: ${S.sent}₽. Слов: ${S.words.length}. Ачивок: ${S.ach.length}.</p>
    ${S.over==="win"?'<button class="main" id="cont">Бесконечная карьера<small>Остаться плиточником и копить на мечты</small></button>':""}
    <button ${S.over==="win"?"":'class="main"'} id="again">Начать заново</button></div>
    <div class="panel"><h2>Рекорды</h2><p class="log">Быстрее всех построить дом</p>${recordsHtml()}</div>`;
  if(S.over==="win")$("#cont").onclick=()=>{S.over=null;S.endless=true;S.finale=false;S.phase="evening";S.log=["Билибиджон вернулся на стройку. Мама дала с собой 4 кг сухофруктов."];render();};
  $("#again").onclick=()=>{const set=S.settings;S=fresh();S.settings=set;render()};
  if(S.over!=="win")Snd.fail();
}

/* ================= НАСТРОЙКИ И КОД СОХРАНЕНИЯ ================= */
function saveCode(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function openSettings(){
  const st=S.settings,on=v=>v?"вкл":"выкл";
  showDialog("Настройки",`<p class="log">Версия ${APP_VERSION} · копия сохранения: ${S.lastBackup?"день "+S.lastBackup:"ещё не делалась"}${persisted?" · 🔒 защищено от очистки":""}</p>`,[
    [`🔊 Звук: ${on(st.sound)}`,()=>{st.sound=!st.sound;Snd.chime();save();openSettings();}],
    [`🎵 Музыка: ${on(st.music)}`,()=>{st.music=!st.music;st.music?Music.start():Music.stop();save();openSettings();}],
    [`📳 Вибрация: ${on(st.vibe)}`,()=>{st.vibe=!st.vibe;vib(60);save();openSettings();}],
    ["💾 Сохранить в файл",exportFile],
    ["📂 Загрузить из файла",importFile],
    ["🔑 Код сохранения",openSaveCode],
    ["🏆 Рекорды",()=>showDialog("Рекорды",recordsHtml(),[["Закрыть",closeDialog]])],
    ["🗑️ Начать заново",()=>showDialog("Точно?","Весь прогресс пропадёт. Ачивки тоже.",[["Нет, играть дальше",closeDialog],["Да, заново",()=>{const set=S.settings;S=fresh();S.settings=set;closeDialog();render();}]])],
    ["Закрыть",closeDialog]],true);
}
function openSaveCode(){
  showDialog("Код сохранения",`<p class="log">Скопируй код и вставь на другом телефоне, чтобы перенести игру.</p><textarea id="codeOut" readonly>${saveCode()}</textarea>
    <p class="log">Или вставь сюда код с другого устройства:</p><textarea id="codeIn" placeholder="Вставь код…"></textarea>`,[
    ["📋 Скопировать мой код",async()=>{const v=$("#codeOut").value;try{await navigator.clipboard.writeText(v);S.lastBackup=S.day;save();toast("Код скопирован");}catch(e){$("#codeOut").select();document.execCommand&&document.execCommand("copy");toast("Код выделен — скопируй его");}}],
    ["📥 Загрузить код",()=>{try{applySave(parseSave($("#codeIn").value));}
      catch(e){toast("Код не подошёл. Проверь, что скопирован целиком.");Snd.fail();}}],
    ["Закрыть",closeDialog]]);
}
/* ---------- файл сохранения и защита от очистки ---------- */
let persisted=false;
function askPersist(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=!!p;}).catch(()=>{});}}catch(e){}}
function needBackup(){return S.day>=4&&S.day-(S.lastBackup||0)>=5&&S.day>=(S.backupSnooze||0);}
function parseSave(txt){txt=String(txt).trim();let d;try{d=JSON.parse(txt);}catch(e){d=JSON.parse(decodeURIComponent(escape(atob(txt))));}
  if(d&&d.game==="bilibidjon")d=d.state;if(!d||typeof d.day!=="number")throw new Error("bad save");return d;}
function applySave(d){const set=S.settings;S=Object.assign(fresh(),d);S.settings=set;S.stats=Object.assign(fresh().stats,S.stats||{});S.eve=S.eve||{};S.xp=S.xp||{};S.ach=S.ach||[];S.docs=Object.assign(fresh().docs,S.docs||{});
  if(S.phase==="work")S.phase="morning";if(S.phase==="migration"&&!S.mig)S.mig={queued:false,windows:0,log:[],sub:null};closeDialog();save();toast("Игра загружена!");Snd.fanfare();render();}
async function exportFile(){
  askPersist();
  const name=`bilibidjon-save-den-${S.day}.json`,data=JSON.stringify({game:"bilibidjon",version:APP_VERSION,saved:new Date().toISOString(),state:S},null,1);
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:"Сохранение Билибиджона"});}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
    S.lastBackup=S.day;save();toast("💾 Сохранение готово");Snd.coin();
  }catch(e){if(e&&e.name==="AbortError")return;toast("Файл не сохранился. Используй код сохранения.");Snd.fail();}
}
function importFile(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json,text/plain";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;let d;
    try{d=parseSave(await f.text());}catch(e){toast("Это не сохранение Билибиджона.");Snd.fail();return;}
    showDialog("Загрузить сохранение?",`<p>В файле: день ${d.day}, отправлено домой ${d.sent||0}₽, ачивок ${(d.ach||[]).length}.</p><p class="log">Текущий прогресс заменится.</p>`,
      [["Загрузить",()=>applySave(d)],["Отмена",closeDialog]]);};
  inp.click();
}

/* ================= ОБНОВЛЕНИЯ ================= */
let updateReady=null,updateDismissed=false,installingUpdate=false,reloading=false;
async function onUpdateReady(worker){
  let info={version:"",notes:""};
  try{info=await (await fetch("version.json",{cache:"no-store"})).json();}catch(e){}
  updateReady={worker,info};updateDismissed=false;showUpdate();
}
function showUpdate(){
  const old=$("#upd");if(old)old.remove();
  if(!updateReady||updateDismissed||S.phase==="work"||dialogOpen)return;
  const {info}=updateReady,d=document.createElement("div");d.id="upd";d.className="upd";
  d.innerHTML=`<div class="panel"><h2>Обновление готово${info.version&&info.version!==APP_VERSION?" · v"+esc(info.version):""}</h2>${info.notes?`<p>${esc(info.notes)}</p>`:""}<p class="log">Уже скачано. Установка займёт секунду, прогресс сохранится.</p><button class="main" id="updGo">Установить</button><button id="updLater">Позже</button></div>`;
  document.body.appendChild(d);
  $("#updGo").onclick=()=>{save();installingUpdate=true;$("#updGo").textContent="Устанавливаю…";$("#updGo").disabled=true;
    updateReady.worker.postMessage({type:"SKIP_WAITING"});setTimeout(()=>{if(!reloading){reloading=true;location.reload();}},4000);};
  $("#updLater").onclick=()=>{updateDismissed=true;d.remove();};
}
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(installingUpdate&&!reloading){reloading=true;location.reload();}});
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("sw.js");
      const check=()=>reg.update().catch(()=>{});
      if(reg.waiting&&navigator.serviceWorker.controller)onUpdateReady(reg.waiting);
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w)return;
        w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)onUpdateReady(w);});});
      setInterval(check,30*60*1000);
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)check();});
      window.addEventListener("online",check);
    }catch(e){/* нет sw.js рядом (например, превью) — игра работает и без обновлений */}
  });
}

/* ================= ДИАЛОГИ И КНОПКА «НАЗАД» ================= */
let dialogOpen=false;
function showDialog(title,html,buttons){
  closeDialog(true);dialogOpen=true;paused=true;
  const d=document.createElement("div");d.className="dlg";d.id="dlg";
  d.innerHTML=`<div class="panel" role="dialog" aria-modal="true" style="max-height:85vh;overflow:auto"><h2>${title}</h2>${html?`<div>${html}</div>`:""}${buttons.map((b,i)=>`<button data-b="${i}" class="${i===0?'main':''}">${b[0]}</button>`).join("")}</div>`;
  document.body.appendChild(d);
  d.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>buttons[+el.dataset.b][1]());
  d.querySelector("button").focus();
}
function closeDialog(keep){const d=$("#dlg");if(d)d.remove();dialogOpen=false;if(keep!==true)paused=false;}
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function exitGame(){save();if(CapApp)return CapApp.exitApp();window.removeEventListener("popstate",onPop);history.go(-2);}
function onBack(){
  if(dialogOpen){closeDialog();return;}
  if(S.phase==="work"&&!S.over){
    return showDialog("Пауза","<p>Билибиджон присел на ведро. Бросишь смену — заработок 0₽.</p>",[
      ["Работать дальше",closeDialog],
      ["Бросить смену",()=>{closeDialog();if(stopCurrent)stopCurrent();unlock("runaway");endJob(0,"Билибиджон сбежал со смены. Заказчик до сих пор ищет его по району.");}]]);
  }
  showDialog("Выйти из игры?","<p>Прогресс сохранён. Билибиджон подождёт.</p>",[["Остаться",closeDialog],["Выйти",exitGame]]);
}
function onPop(){history.pushState({bili:1},"");onBack();}
if(CapApp)CapApp.addListener("backButton",onBack);
else if(standalone){history.pushState({bili:1},"");window.addEventListener("popstate",onPop);}
document.addEventListener("keydown",e=>{if(e.key==="Escape")onBack();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.phase==="work"&&!dialogOpen)onBack();save();});

/* ================= СТАРТ ================= */
(function(){const old=load()||{};S=Object.assign(fresh(),old);
  if("sound" in old&&!old.settings){S.settings.sound=old.sound;delete S.sound;}
  S.stats=Object.assign(fresh().stats,S.stats||{});S.eve=S.eve||{};if(!old.docs&&old.day>1)S.docGrace=old.day+4;S.docs=Object.assign(fresh().docs,S.docs||{});if(S.phase==="migration"&&!S.mig)S.mig={queued:false,windows:0,log:[],sub:null};S.xp=S.xp||{};S.ach=S.ach||[];S.mnotes=S.mnotes||[];
  if(S.phase==="work")S.phase="morning";
  if(S.phase==="result"&&S.result&&S.result.valeraDone===undefined){S.result.valeraDone=true;S.result.qDone=true;S.result.dr=0;}
})();
askPersist();
render();
</script>
</body>
</html>
