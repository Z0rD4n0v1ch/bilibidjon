<style>
/* Локальные шрифты для офлайна (папка fonts/). Если её нет — берутся шрифты Google. */
@font-face{font-family:BiliDisplay;font-weight:400;font-display:swap;src:url("fonts/russo-one-cyrillic-400-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliDisplay;font-weight:400;font-display:swap;src:url("fonts/russo-one-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:BiliBody;font-weight:400;font-display:swap;src:url("fonts/rubik-cyrillic-400-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliBody;font-weight:400;font-display:swap;src:url("fonts/rubik-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:BiliBody;font-weight:500;font-display:swap;src:url("fonts/rubik-cyrillic-500-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliBody;font-weight:500;font-display:swap;src:url("fonts/rubik-latin-500-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:BiliBody;font-weight:700;font-display:swap;src:url("fonts/rubik-cyrillic-700-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:BiliBody;font-weight:700;font-display:swap;src:url("fonts/rubik-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#DDE7E9; --tile:#9ED8C8; --tile-2:#BFE6DA; --grout:#C3CCD1;
  --surface:#FFFFFF; --ink:#14213D; --muted:#55657A;
  --cobalt:#1F4FA8; --tape:#FFC93C; --bad:#C8352E; --good:#1E8A5A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A33; --tile:#1D4A52; --tile-2:#24585F; --grout:#0A1326;
    --surface:#18284A; --ink:#EEF3F7; --muted:#A9B8CC;
    --cobalt:#7FA6F0; --tape:#FFC93C; --bad:#FF7A6E; --good:#5FD39A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A33; --tile:#1D4A52; --tile-2:#24585F; --grout:#0A1326;
  --surface:#18284A; --ink:#EEF3F7; --muted:#A9B8CC;
  --cobalt:#7FA6F0; --tape:#FFC93C; --bad:#FF7A6E; --good:#5FD39A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; min-height:100dvh; -webkit-touch-callout:none; -webkit-text-size-adjust:100%; color:var(--ink); font:16px/1.5 BiliBody,Rubik,system-ui,sans-serif;
  touch-action:manipulation; overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grout) 3px,transparent 3px),linear-gradient(90deg,var(--grout) 3px,transparent 3px);
  background-size:64px 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px 40px}
h1{font-family:BiliDisplay,"Russo One",Rubik,sans-serif;font-weight:400;font-size:2rem;line-height:1.05;margin:.2em 0}
h2{font-family:BiliDisplay,"Russo One",Rubik,sans-serif;font-weight:400;font-size:1.35rem;margin:0 0 .4em}
p{margin:.4em 0}
.panel{background:var(--surface);border:3px solid var(--ink);border-radius:4px;padding:16px;margin:12px 0;box-shadow:5px 5px 0 var(--ink)}
.tape{background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#14213D 14px 28px);height:12px;border-radius:2px;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr) 44px;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0;background:var(--bg)}
.stat{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:4px 6px;text-align:center;font-size:.75rem;color:var(--muted)}
.stat b{display:block;font-size:1.05rem;color:var(--ink)}
.bar{height:6px;background:var(--grout);border-radius:3px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
button{font:500 1rem BiliBody,Rubik,sans-serif;color:var(--ink);background:var(--tile);border:3px solid var(--ink);border-radius:4px;padding:12px 14px;width:100%;margin:6px 0;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.main{background:var(--tape);color:#14213D;font-family:BiliDisplay,"Russo One",Rubik,sans-serif;text-align:center;font-size:1.1rem}
button small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
button.main small{color:#14213D}
button.snd{margin:0;padding:0;text-align:center;font-size:1.2rem;box-shadow:none;border-width:2px;background:var(--surface)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.quote{font-size:1.1rem;padding:10px 12px;background:var(--tile-2);border-left:6px solid var(--cobalt);border-radius:2px;margin:8px 0}
.gib{font-style:italic;color:var(--bad)}
.who{color:var(--muted);font-size:.85rem}
.log{font-size:.9rem;color:var(--muted)}
.log p{border-bottom:1px dashed var(--grout);padding:4px 0}
canvas{display:block;width:100%;touch-action:none;border:3px solid var(--ink);border-radius:4px;background:var(--grout)}
.hud{display:flex;justify-content:space-between;font-family:BiliDisplay,"Russo One",sans-serif;margin:6px 0}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.words span{background:var(--tile-2);border:2px solid var(--ink);padding:1px 8px;border-radius:2px;font-size:.85rem}
.big{font-family:BiliDisplay,"Russo One",sans-serif;font-size:2.4rem;line-height:1}
.good{color:var(--good)} .bad{color:var(--bad)}
.hero{display:flex;gap:12px;align-items:flex-end}
.hero svg{flex:0 0 96px;width:96px;height:112px}
.bubble{position:relative;background:var(--tile-2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-size:.95rem;margin-bottom:20px}
.bubble::after{content:"";position:absolute;left:-10px;bottom:10px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.bili{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
.bili.dizzy{animation:wobble 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.owned{opacity:.6}
.dlg{position:fixed;inset:0;z-index:20;background:rgba(10,19,38,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg .panel{width:100%;max-width:380px}
.upd{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 8px);animation:up .35s ease-out}
.upd .panel{max-width:452px;margin:0 auto;border-color:var(--ink);background:var(--surface)}
.upd button{display:inline-block;width:auto;margin-right:8px}
.bar.big{height:10px;margin:6px 0}.bar.big i{transition:width .2s}
@keyframes up{from{transform:translateY(110%)}}
@media (prefers-reduced-motion:reduce){button:active{transform:none}.bili,.bili.dizzy{animation:none}}
.stats{grid-template-columns:repeat(4,1fr) 40px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:30;background:var(--tape);color:#14213D;border:3px solid #14213D;border-radius:4px;padding:8px 14px;font-weight:700;box-shadow:4px 4px 0 #14213D;max-width:90vw;animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.row{display:flex;gap:8px}.row button{flex:1}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.ach div{border:2px solid var(--ink);border-radius:4px;padding:6px;font-size:.8rem;background:var(--tile-2)}
.ach div.locked{opacity:.4;background:var(--surface)}
.ach b{display:block;font-size:.85rem}
details summary{cursor:pointer;font-family:BiliDisplay,"Russo One",sans-serif;font-size:1.15rem}
.skills div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--grout);padding:3px 0;font-size:.9rem}
.house svg{width:100%;height:auto;display:block;border:3px solid var(--ink);border-radius:4px}
.tag{display:inline-block;background:var(--tape);color:#14213D;font-size:.75rem;font-weight:700;padding:0 6px;border-radius:2px;margin-left:4px}
textarea{width:100%;min-height:90px;font:16px monospace;border:2px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);padding:6px;-webkit-user-select:text;user-select:text}
.ev{background:var(--tape);color:#14213D;padding:4px 8px;border-radius:2px;font-weight:500;font-size:.9rem}
/* --- минималистичный HUD --- */
.stats{display:flex;align-items:center;gap:clamp(8px,3vw,14px);padding:7px 6px 7px 12px;margin:6px 0 4px;background:var(--surface);border:2px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:opacity .25s}
.stats.dim{opacity:.45}
.stat{all:unset;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;font:700 .95rem/1 BiliBody,Rubik,sans-serif;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stat:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:4px}
.toast{white-space:nowrap}
.stat .mini{width:clamp(22px,7vw,30px);height:5px;background:var(--grout);border-radius:3px;overflow:hidden}
.stat .mini i{display:block;height:100%;border-radius:3px}
.stat.low{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.gear{all:unset;margin-left:auto;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:1.05rem;cursor:pointer}
.gear:active{background:var(--grout)}
.gear:focus-visible{outline:2px solid var(--cobalt)}
.hud{font:500 .9rem BiliBody,Rubik,sans-serif;color:var(--muted);margin:4px 0}
@media (prefers-reduced-motion:reduce){.stat.low{animation:none}}
.dot{background:var(--bad);color:#fff;font-size:.65rem;border-radius:8px;padding:1px 5px;margin-left:-3px;position:relative;top:-8px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;margin-bottom:8px;padding:2px}
.msg{background:var(--tile-2);border:2px solid var(--ink);border-radius:12px 12px 12px 2px;padding:6px 10px;max-width:85%;font-size:.95rem}
.msg b{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.msg.me{align-self:flex-end;background:var(--tape);color:#14213D;border-radius:12px 12px 2px 12px}
.msg.card{font-size:1.1rem}
.voice{all:unset;cursor:pointer;font-weight:500}
.ach div svg{width:72px;height:84px;display:block;margin:0 auto}
.looks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.looks button{margin:0;font-size:.85rem;padding:8px}
.looks button.on{background:var(--tape);color:#14213D}
.tabs{display:flex;gap:5px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--bg);padding:6px 0 4px}
.tabs button{all:unset;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.tabs b{font-size:1.15rem;line-height:1;font-weight:400}
.tabs span{font:500 .7rem/1 BiliBody,Rubik,sans-serif;white-space:nowrap}
.tabs button.on{background:var(--tape);color:#14213D;box-shadow:2px 2px 0 var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.tabs i{position:absolute;top:-7px;right:-3px;background:var(--bad);color:#fff;font:700 .65rem/1.4 BiliBody,Rubik,sans-serif;font-style:normal;border-radius:8px;padding:0 5px}
[hidden]{display:none!important}
@media (hover:hover) and (pointer:fine){
  .panel button:not(:disabled):not(.voice):hover{filter:brightness(1.06);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .stat:hover,.gear:hover{opacity:.7}
  .tabs button:hover{border-color:var(--cobalt);color:var(--ink)}
  canvas{cursor:crosshair}
}
@media (min-width:900px){.wrap{max-width:520px}}
.keys{display:inline-block;font-size:.8rem;color:var(--muted);margin-left:4px}
</style>
</head>

<script>
const APP_VERSION = "1.8.4";
const GOAL = 5000;
const WORDS = ["деньги","плитка","стена","ванная","кухня","шов","краска","быстро","хорошо","криво","завтра","спасибо"];
const GIB = ["шмурдык","тыгыдык","кукурумба","бряк-бряк","фыр-фыр","бульк","трямс","хрюм"];

/* ---------- заказчики с характером ---------- */
const CLIENTS = {
  galya:{name:"Тётя Галя",minRep:0,pay:1,trait:"Платит как договорились. Редкость."},
  zina:{name:"Бабушка Зина",minRep:0,pay:.6,pies:true,trait:"Платит меньше, зато пирожками"},
  valera:{name:"Прораб Валера",minRep:0,pay:1.1,valera:true,trait:"Любит «временно» не доплачивать"},
  arseniy:{name:"Хипстер Арсений",minRep:10,pay:1.2,crooked:true,trait:"Ценит «авторскую кривизну»"},
  kristina:{name:"Блогер Кристина",minRep:20,pay:1.3,blog:true,trait:"Снимает всё. Репутация ×3"},
  edik:{name:"Олигарх Эдик",minRep:45,pay:1.9,rush:true,trait:"Платит много, но торопит: −25% времени"},
  mama:{name:"Мама",minRep:999,pay:0,trait:"Самый важный заказчик"},
  gig:{name:"Подработка",minRep:999,pay:1,trait:""},
  angelika:{name:"Дизайнер Анжелика",minRep:30,pay:1.5,vibe:true,trait:"Оценивает по «вайбу». Ровность — не главное."},
  sergey:{name:"Сергей «Евроремонт»",minRep:999,pay:1,trait:"Работаю с 1998. Ровнее меня только лазер."},
  tv:{name:"Телешоу «Ремонт за 24 часа»",minRep:999,pay:1,rush:true,trait:"Камера, мотор! Времени меньше."},
  objc:{name:"Объект",minRep:999,pay:1,trait:"Объект ждёт. Комиссия — тоже."},
  oldhouse:{name:"Хозяин старого дома",minRep:999,pay:1,trait:"Дом 1972 года. Под плиткой — сюрпризы."},
  night:{name:"Ночной вызов",minRep:999,pay:1,trait:""},
  nigora:{name:"Соседка Нигора",minRep:999,pay:0,trait:""},
};
const JOBS = {
  tile:{name:"Плитка",verb:"Класть плитку",base:420,orders:["Хочу {плитка} в {ванная}, но {быстро}!","{плитка} на {кухня}, чтоб не {криво}. {деньги} дам.","Сделай {хорошо} {плитка} в {ванная}. {деньги} {завтра}."],help:"Жми, когда пузырёк уровня в центре."},
  putty:{name:"Шпаклёвка",verb:"Шпаклевать стену",base:340,orders:["{стена} {криво}, сделай {хорошо}!","На {кухня} {стена} как Луна. {быстро}!","{стена} в {ванная}, {деньги} {завтра}, честно."],help:"Води пальцем по стене и заглаживай бугры."},
  grout:{name:"Затирка швов",verb:"Затирать швы",base:300,orders:["Затри {шов} {хорошо}, {плитка} не пачкай!","{шов} в {ванная} чёрные, сделай белые. {быстро}!","{плитка} есть, {шов} нет. {деньги} {завтра}."],help:"Веди по тёмным швам. Мимо шва — пачкаешь плитку."},
  paint:{name:"Покраска",verb:"Красить стену",base:360,orders:["{краска} на {стена}, окно не трогай!","Покрась {кухня} {быстро}, розетку не крась!","Хочу {стена} цвета мечты. {деньги} {хорошо}."],help:"Крась валиком. Окно и розетку не трогай. Краска кончилась — макни валик в ведро внизу."},
  cut:{name:"Резка плитки",verb:"Резать плитку",base:330,orders:["Отрежь {плитка} ровно, не {криво}!","Нужно 3 {плитка} под трубу в {ванная}. {быстро}!","{плитка} режь {хорошо}, она итальянская. {деньги}."],help:"Плиткорез едет сам. Веди пальцем вверх-вниз точно по разметке."},
  mosaic:{name:"Мозаика",verb:"Собирать мозаику",base:390,orders:["Хочу узор в {ванная} как на фото!","Мозаика на {кухня}, {быстро} и {хорошо}!","Узор как у Эдика, только лучше. {деньги} {завтра}."],help:"Тапай по клеткам, чтобы менять цвет. Собери узор как на образце."},

const Snd = {
  ctx:null,last:{},
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();},
  tone(f,d,type="square",vol=.08,f2=null,delay=0,music=false){
    if(!this.ctx||!(music?S.settings.music:S.settings.sound))return;
    const c=this.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);
  },
  throttle(k,ms){const n=performance.now();if(n-(this.last[k]||0)<ms)return false;this.last[k]=n;return true;},
  click(q){this.tone(220+q*500,.09,"square",.07);if(q>.9)this.tone(1200,.06,"triangle",.05,null,.05);},
  squish(){if(this.throttle("sq",70))this.tone(140+Math.random()*60,.06,"sawtooth",.035,90);},
  roll(){if(this.throttle("rl",90))this.tone(80+Math.random()*30,.08,"triangle",.05);},
  coin(){this.tone(988,.08,"square",.06);this.tone(1319,.18,"square",.06,null,.08);},
  fail(){this.tone(160,.35,"sawtooth",.07,70);},
  ring(){[0,.18,.5,.68].forEach(d=>this.tone(1400,.12,"sine",.07,null,d));},
  nas(){this.tone(700,.5,"sine",.08,180);},
  chime(){[523,659,784].forEach((f,i)=>this.tone(f,.15,"triangle",.07,null,i*.09));},
  fanfare(){[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.18,"square",.06,null,i*.12));},
  splat(){this.tone(90,.15,"square",.06,50);},
  step(){if(this.throttle("st",250))this.tone(300,.05,"triangle",.04);},
  meow(){this.tone(900,.3,"sine",.06,450);},
  drill(){if(this.throttle("dr",120))this.tone(1100+Math.random()*200,.1,"sawtooth",.025);},
  cut(){if(this.throttle("ct",60))this.tone(2000+Math.random()*400,.04,"sawtooth",.015);},
};
const Music = {
  timer:null,step:0,
  bass:[110,110,147,131],
  mel:[440,0,523,587,0,659,587,523,440,0,392,440,0,523,0,0,587,0,659,784,0,659,587,0,523,0,440,392,0,440,0,0],
  start(){if(this.timer||!S.settings.music)return;Snd.init();if(!Snd.ctx)return;this.timer=setInterval(()=>this.tick(),230);},
  stop(){clearInterval(this.timer);this.timer=null;},
  tick(){if(document.hidden)return;const s=this.step++%32;
    if(s%4===0)Snd.tone(this.bass[Math.floor(s/8)],.25,"triangle",.06,null,0,true);

    if(this.mel[s])Snd.tone(this.mel[s],.17,"square",.02,null,0,true);},

function sizeMul(t){return (S.nasActive?1+.4*nasEff():1)*(S.withdraw?.8:1)*(S.happy<30?.88:1)*(S.hungry?.9:1)*(S.tired?.9:1)*(S.strong?1.1:1)*skillF(t);}

function setupCanvas(cv,ratio){
  const w=cv.clientWidth,h=Math.round(w*ratio),d=window.devicePixelRatio||1;
  cv.style.height=h+"px";cv.width=w*d;cv.height=h*d;
  const c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);return {c,w,h};
}
function dragInput(cv,fn,state){
  const pos=e=>{const b=cv.getBoundingClientRect(),j=shake();return [e.clientX-b.left+(Math.random()-.5)*j,e.clientY-b.top+(Math.random()-.5)*j]};
  cv.onpointerdown=e=>{state.down=true;cv.setPointerCapture(e.pointerId);[state.x,state.y]=pos(e);fn(state.x,state.y)};
  cv.onpointermove=e=>{if(!state.down)return;const [x,y]=pos(e);const n=Math.ceil(Math.hypot(x-state.x,y-state.y)/5);
    for(let s=1;s<=n;s++)fn(state.x+(x-state.x)*s/n,state.y+(y-state.y)*s/n);state.x=x;state.y=y};
  cv.onpointerup=cv.onpointercancel=()=>state.down=false;
}
let paused=false,stopCurrent=null;
function timer(T,onTick,onEnd){
  let t0=performance.now(),last=t0,stop=false;
  (function loop(now){if(stop)return;if(paused)t0+=now-last;last=now;
    if(paused){requestAnimationFrame(loop);return;}
    const el=(now-t0)/1000,left=Math.max(0,T-el);$("#tm").textContent="⏱ "+left.toFixed(1);
    if(onTick(el)===true||left<=0){stop=true;return onEnd();}requestAnimationFrame(loop);})(t0);
  stopCurrent=()=>stop=true;return stopCurrent;
}

/* ---------- плитка ---------- */
function tileGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1),crooked=CLIENTS[S.job.client].crooked;
  const cols=4,rows=4,pad=12,wallH=h-60,cw=(w-pad*2)/cols,ch=(wallH-pad*2)/rows;
  const placed=[];let flash=0,t=0,done=false,catHit=false;
  const omega=2.6*speedMul("tile")+0.1*Math.min(S.day,20);
  const off=t=>Math.sin(t*omega)*.85+Math.sin(t*omega*2.7)*.15*(S.withdraw?2:1);
  EV.onCat=()=>{if(placed.length){placed.pop();catHit=true;}};
  cv.onpointerdown=e=>{if(done)return;e.preventDefault();const o=off(t);placed.push(o);flash=1;const q=1-Math.min(1,Math.abs(o));Snd.click(crooked?1-q:q);if(!crooked&&q<.45)vib(30);};
  timer(26*tm(),tt=>{
    t=tt;$("#sc").textContent=placed.length+" / "+cols*rows;
    c.fillStyle=css("--grout");c.fillRect(0,0,w,h);
    for(let i=0;i<cols*rows;i++){
      const x=pad+(i%cols)*cw,y=pad+Math.floor(i/cols)*ch;
      if(i<placed.length){c.save();c.translate(x+cw/2,y+ch/2);c.rotate(placed[i]*.35);
        c.fillStyle=i%2?css("--tile"):css("--tile-2");c.strokeStyle=css("--ink");c.lineWidth=2;
        c.fillRect(-cw/2+3,-ch/2+3,cw-6,ch-6);c.strokeRect(-cw/2+3,-ch/2+3,cw-6,ch-6);c.restore();}
      else{c.strokeStyle=css("--muted");c.setLineDash([4,4]);c.strokeRect(x+3,y+3,cw-6,ch-6);c.setLineDash([]);}
    }
    const ly=h-42,lw=w-40;
    c.fillStyle=css("--tape");c.fillRect(20,ly,lw,28);c.strokeStyle=css("--ink");c.lineWidth=3;c.strokeRect(20,ly,lw,28);
    c.fillStyle="rgba(30,138,90,.35)";if(crooked){c.fillRect(23,ly+3,lw*.15,22);c.fillRect(17+lw*.85,ly+3,lw*.15,22);}else c.fillRect(20+lw/2-lw*.1,ly+3,lw*.2,22);
    if(has("laser")&&!crooked){c.strokeStyle="#FF2E2E";c.lineWidth=1.5;c.beginPath();c.moveTo(20+lw/2,0);c.lineTo(20+lw/2,ly);c.stroke();}
    const bx=20+lw/2+off(t)*(lw/2-14);
    c.lineWidth=3;c.strokeStyle=css("--ink");c.beginPath();c.arc(bx,ly+14,10+flash*4,0,Math.PI*2);c.fillStyle="#E8FFF5";c.fill();c.stroke();
    flash*=.85;evTick(c,w,h,t,cv);
    return placed.length>=cols*rows;
  },()=>{done=true;
    const total=cols*rows;let q=placed.reduce((a,o)=>a+(crooked?Math.min(1,Math.abs(o)/.8):1-Math.min(1,Math.abs(o))),0)/total;
    const crk=placed.filter(o=>Math.abs(o)>.55).length;let note="";
    if(catHit)note="Кот прогулялся по свежей плитке и унёс одну на лапах. ";
    if(crooked)note+=q>.7?"Арсений в восторге: «Это не криво, это концепция!»":"Арсений разочарован: «Слишком ровно. Скучно. Мейнстрим.»";
    else if(crk>3)note+=`Заказчик насчитал ${crk} кривых плиток и сказал слово, которого Билибиджон пока не знает.`;
    endJob(q,note);
  });
}
/* ---------- шпаклёвка ---------- */
function puttyGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);
  const gx=16,gy=18,cw=w/gx,chh=h/gy,cells=[];
  for(let i=0;i<gx*gy;i++)cells.push(Math.random()<.55?1:0);
  const need=cells.filter(v=>v).length,st={},r=24*sizeMul("putty")*(has("spatula")?1.35:1);
  dragInput(cv,(x,y)=>{for(let i=0;i<cells.length;i++){if(!cells[i])continue;const cx=(i%gx+.5)*cw,cy=(Math.floor(i/gx)+.5)*chh;
    if((cx-x)**2+(cy-y)**2<r*r){cells[i]=0;Snd.squish();}}},st);
  timer(Math.max(10,18-S.day*.3)*tm(),t=>{
    const remain=cells.filter(v=>v).length;$("#sc").textContent=Math.round((1-remain/need)*100)+"%";
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle=css("--muted");
    for(let i=0;i<cells.length;i++){if(!cells[i])continue;const x=(i%gx)*cw,y=Math.floor(i/gx)*chh;c.beginPath();c.ellipse(x+cw/2,y+chh/2,cw*.42,chh*.38,0,0,Math.PI*2);c.fill();}
    if(st.down){c.strokeStyle=css("--cobalt");c.lineWidth=3;c.beginPath();c.arc(st.x,st.y,r,0,Math.PI*2);c.stroke();}
    evTick(c,w,h,t,cv);return remain===0;
  },()=>{const q=1-cells.filter(v=>v).length/need;endJob(q,q<.6?"Стена всё ещё похожа на Луну. Заказчик фотографирует её для блога.":"");});
}
/* ---------- затирка ---------- */
function groutGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1);
  const n=4,g=10,ts=(w-g*(n+1))/n,pts=[],smudges=[],st={};
  const seamPos=i=>g/2+i*(ts+g);
  for(let i=1;i<n;i++){for(let p=0;p<=h;p+=7){pts.push({x:seamPos(i),y:p,f:0});pts.push({x:p,y:seamPos(i),f:0});}}
  const r=13*sizeMul("grout")*(has("float")?1.35:1),smudgeMul=has("float")?.5:1;let smudgeScore=0;
  dragInput(cv,(x,y)=>{let near=false;for(let i=1;i<n;i++){if(Math.abs(x-seamPos(i))<g/2+5||Math.abs(y-seamPos(i))<g/2+5)near=true;}
    for(const p of pts){if(!p.f&&(p.x-x)**2+(p.y-y)**2<r*r){p.f=1;Snd.squish();}}
    if(!near){smudgeScore+=smudgeMul;if(smudges.length<400&&Math.random()<.5*smudgeMul)smudges.push([x,y]);}},st);
  timer(Math.max(12,22-S.day*.3)*tm(),t=>{
    const filled=pts.filter(p=>p.f).length;$("#sc").textContent=Math.round(filled/pts.length*100)+"%";
    c.fillStyle="#3B3F46";c.fillRect(0,0,w,h);
    for(let i=0;i<n*n;i++){const x=g+(i%n)*(ts+g),y=g+Math.floor(i/n)*(ts+g);c.fillStyle=(i+Math.floor(i/n))%2?css("--tile"):css("--tile-2");c.fillRect(x,y,ts,ts);}
    c.fillStyle="#3B3F46";c.fillRect(0,0,w,g);c.fillRect(0,h-g,w,g);c.fillRect(0,0,g,h);c.fillRect(w-g,0,g,h);
    c.fillStyle="#F1F1EC";for(const p of pts)if(p.f){c.beginPath();c.arc(p.x,p.y,g/2+1,0,Math.PI*2);c.fill();}
    c.fillStyle="rgba(150,150,140,.55)";for(const [x,y] of smudges){c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();}
    if(st.down){c.strokeStyle=css("--tape");c.lineWidth=3;c.strokeRect(st.x-r,st.y-r,r*2,r*2);}
    evTick(c,w,h,t,cv);return filled===pts.length;
  },()=>{const q=pts.filter(p=>p.f).length/pts.length-Math.min(.45,smudgeScore*.003);
    endJob(q,smudgeScore>60?"Плитка теперь тоже затёрта. Вся. Заказчик назвал это «авторский стиль» и вычел из оплаты.":"");});
}
/* ---------- покраска ---------- */
function paintGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.25);
  const bucketH=56,wallH=h-bucketH,gx=14,gy=16,cw=w/gx,ch=wallH/gy,cells=[],st={};
  const forbidden=i=>{const x=i%gx,y=Math.floor(i/gx);return (x>=3&&x<=7&&y>=2&&y<=7)||(x>=10&&x<=11&&y>=11&&y<=12);};
  for(let i=0;i<gx*gy;i++)cells.push(0);
  const allowedTotal=cells.filter((_,i)=>!forbidden(i)).length,forbTotal=gx*gy-allowedTotal;
  const r=20*sizeMul("paint")*(has("roller")?1.3:1),cost=has("roller")?.8:1.25,color=PAINT_HEX[S.job.color]||"#F6B48F";
  let paint=100,warned=false;
  dragInput(cv,(x,y)=>{
    if(y>wallH){if(paint<100){paint=100;Snd.splat();}return;}
    if(paint<=0){if(!warned){Snd.fail();vib(40);warned=true;}return;}
    for(let i=0;i<cells.length;i++){if(cells[i])continue;const cx=(i%gx+.5)*cw,cy=(Math.floor(i/gx)+.5)*ch;if((cx-x)**2+(cy-y)**2<r*r){cells[i]=1;paint-=cost;Snd.roll();}}
    if(paint>0)warned=false;},st);
  timer(Math.max(13,22-S.day*.3)*tm(),t=>{
    const good=cells.filter((v,i)=>v&&!forbidden(i)).length;$("#sc").textContent=Math.round(good/allowedTotal*100)+"%";
    c.fillStyle="#D9D6CF";c.fillRect(0,0,w,wallH);
    for(let i=0;i<cells.length;i++){const x=(i%gx)*cw,y=Math.floor(i/gx)*ch;
      if(forbidden(i)&&!cells[i]){c.fillStyle=(i%gx>=10)?"#FFFFFF":"#9FD3F2";c.fillRect(x,y,cw+.5,ch+.5);}
      if(cells[i]){c.fillStyle=forbidden(i)?"#C8352E":color;c.fillRect(x,y,cw+.5,ch+.5);}}
    c.strokeStyle="#14213D";c.lineWidth=3;c.strokeRect(3*cw,2*ch,5*cw,6*ch);c.beginPath();c.moveTo(5.5*cw,2*ch);c.lineTo(5.5*cw,8*ch);c.moveTo(3*cw,5*ch);c.lineTo(8*cw,5*ch);c.stroke();
    c.strokeRect(10*cw,11*ch,2*cw,2*ch);c.fillStyle="#14213D";c.beginPath();c.arc(10.7*cw,12*ch,2.5,0,7);c.arc(11.3*cw,12*ch,2.5,0,7);c.fill();
    c.fillStyle=css("--surface");c.fillRect(0,wallH,w,bucketH);c.fillStyle=color;c.fillRect(10,wallH+10,(w-20)*Math.max(0,paint)/100,bucketH-20);
    c.strokeStyle=css("--ink");c.strokeRect(10,wallH+10,w-20,bucketH-20);
    c.fillStyle=css("--ink");c.font="500 14px BiliBody,Rubik,sans-serif";c.fillText(paint>0?"🪣 Краска: "+Math.round(paint)+"%":"🪣 Пусто! Макни валик сюда",18,wallH+33);
    if(st.down&&st.y<wallH){c.strokeStyle=css("--cobalt");c.lineWidth=3;c.beginPath();c.arc(st.x,st.y,r,0,Math.PI*2);c.stroke();}
    evTick(c,w,h,t,cv);return good===allowedTotal;
  },()=>{const good=cells.filter((v,i)=>v&&!forbidden(i)).length,bad=cells.filter((v,i)=>v&&forbidden(i)).length;
    endJob(good/allowedTotal-bad/forbTotal*.8,bad>6?`Окно теперь тоже ${S.job.color}. Заказчик говорит, что так даже уютнее, но платить не будет.`:"");});
}
/* ---------- резка плитки ---------- */
function cutGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,.85);
  const N=S.job.nigora?1:3,dur=(S.job.nigora?3.8:3.2)/speedMul("cut")*tm(),tol=16*sizeMul("cut")*(has("cutter")?1.4:1);
  let idx=0,start=0,errSum=0,n=0,trail=[],cy=h/2,scores=[];
  const mkLine=()=>({y0:h*.28+Math.random()*h*.44,y1:h*.28+Math.random()*h*.44});let L=mkLine();
  const setY=e=>{const b=cv.getBoundingClientRect();cy=e.clientY-b.top;};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);setY(e)};cv.onpointermove=e=>{if(e.buttons||e.pointerType==="touch")setY(e)};
  timer(N*(dur+.8)+2,t=>{
    const local=t-start;$("#sc").textContent=(idx+1)+" / "+N;
    c.fillStyle=css("--grout");c.fillRect(0,0,w,h);
    c.fillStyle=css("--tile-2");c.fillRect(14,14,w-28,h-28);c.strokeStyle=css("--ink");c.lineWidth=3;c.strokeRect(14,14,w-28,h-28);
    c.setLineDash([8,6]);c.strokeStyle=css("--cobalt");c.lineWidth=2;c.beginPath();c.moveTo(20,L.y0);c.lineTo(w-20,L.y1);c.stroke();c.setLineDash([]);
    if(local<.8){c.fillStyle=css("--ink");c.font="500 18px BiliBody,Rubik,sans-serif";c.fillText(idx===0?"Поставь палец на линию…":"Следующая плитка…",24,40);}
    else{const p=Math.min(1,(local-.8)/dur),x=20+(w-40)*p,target=L.y0+(L.y1-L.y0)*p,jy=cy+(Math.random()-.5)*shake();
      errSum+=Math.min(1,Math.abs(jy-target)/tol);n++;trail.push([x,jy]);Snd.cut();
      c.strokeStyle="#C8352E";c.lineWidth=3;c.beginPath();trail.forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));c.stroke();
      c.fillStyle="#B8C2CC";c.strokeStyle=css("--ink");c.beginPath();c.arc(x,jy,11,0,7);c.fill();c.stroke();
      if(p>=1){const s=1-errSum/n;scores.push(s);if(s<.5)vib(60);idx++;start=t;errSum=0;n=0;trail=[];L=mkLine();if(idx>=N)return true;}}
    evTick(c,w,h,t,cv);
  },()=>{while(scores.length<N)scores.push(0);const q=scores.reduce((a,b)=>a+b,0)/N;
    endJob(q,q<.5?"Плитка порезана в форме карты страны, откуда родом заказчик. Он не оценил.":"");});
}
/* ---------- мозаика ---------- */
function mosaicGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.3);
  const COL=["#1F4FA8","#FFC93C","#F2F2EC"],target=Array.from({length:16},()=>Math.floor(Math.random()*3)),cells=Array(16).fill(-1);
  const ph=h*.24,gs=Math.min(w-24,h-ph-16),gx0=(w-gs)/2,gy0=ph+8,cs=gs/4;
  EV.onCat=()=>{cells[Math.floor(Math.random()*16)]=-1;};
  cv.onpointerdown=e=>{const b=cv.getBoundingClientRect(),x=e.clientX-b.left-gx0,y=e.clientY-b.top-gy0;if(x<0||y<0||x>=gs||y>=gs)return;
    const i=Math.floor(y/cs)*4+Math.floor(x/cs);cells[i]=(cells[i]+1)%3;Snd.click(cells[i]===target[i]?1:.3);};
  const T=(22+lvl("mosaic")*1.5+(has("tweezers")?4:0)+(S.nasActive?3*nasEff():0)-(S.withdraw?3:0)-(S.hungry?2:0))*tm();
  timer(T,t=>{
    const ok=cells.filter((v,i)=>v===target[i]).length;$("#sc").textContent=ok+" / 16";
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);
    c.fillStyle=css("--ink");c.font="500 14px BiliBody,Rubik,sans-serif";c.fillText("Образец с фото заказчика:",12,22);
    const ps=(ph-36)/4;for(let i=0;i<16;i++){c.fillStyle=COL[target[i]];c.fillRect(w-12-ps*4+(i%4)*ps,8+Math.floor(i/4)*ps,ps-1,ps-1);}
    for(let i=0;i<16;i++){const x=gx0+(i%4)*cs,y=gy0+Math.floor(i/4)*cs;c.fillStyle=cells[i]<0?css("--grout"):COL[cells[i]];c.fillRect(x+2,y+2,cs-4,cs-4);
      c.strokeStyle=css("--ink");c.lineWidth=2;c.strokeRect(x+2,y+2,cs-4,cs-4);}
    evTick(c,w,h,t,cv);return ok===16;
  },()=>{const q=cells.filter((v,i)=>v===target[i]).length/16;endJob(q,q<.5?"Заказчик долго смотрел на мозаику и сказал, что видит в ней лицо прораба Валеры.":"");});
}
/* ---------- обои ---------- */
function wallGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);
  const N=5,sw=w/N,P=56,placed=[0],omega=2.2*speedMul("wallpaper")+.08*Math.min(S.day,20);let t=0;
  const off=t=>Math.sin(t*omega)*P*.95+(S.withdraw?Math.sin(t*9)*6:0);
  cv.onpointerdown=e=>{e.preventDefault();if(placed.length>=N)return;const o=off(t);placed.push(o);const d=((o%P)+P)%P,er=Math.min(d,P-d)/(P/2);Snd.click(1-er);if(er>.5)vib(30);};
  function strip(x,o,alpha){c.globalAlpha=alpha;c.fillStyle="#F3E3C3";c.fillRect(x,0,sw,h);
    c.strokeStyle="#C98A5B";c.lineWidth=2;for(let y=-P*2;y<h+P*2;y+=P){const yy=y+o;c.beginPath();c.moveTo(x,yy);c.quadraticCurveTo(x+sw/2,yy-14,x+sw,yy);c.stroke();
      c.fillStyle="#C8352E";c.beginPath();c.arc(x+sw/2,yy-7,4,0,7);c.fill();}
    c.strokeStyle=css("--ink");c.lineWidth=1;c.strokeRect(x,0,sw,h);c.globalAlpha=1;}
  timer(22*tm(),tt=>{t=tt;$("#sc").textContent=(placed.length-1)+" / "+(N-1);
    c.fillStyle="#BDB6A8";c.fillRect(0,0,w,h);placed.forEach((o,i)=>strip(i*sw,o,1));
    if(placed.length<N)strip(placed.length*sw,off(t),.75);
    evTick(c,w,h,t,cv);return placed.length>=N;
  },()=>{let s=0;for(let i=1;i<N;i++){if(i<placed.length){const d=((placed[i]-placed[i-1])%P+P)%P;s+=1-Math.min(d,P-d)/(P/2);}}
    const q=s/(N-1);endJob(q,q<.5?"Цветочки на обоях идут лесенкой. Заказчик говорит, что у него от них морская болезнь.":"");});
}
/* ---------- ламинат ---------- */
function laminateGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);
  const rows=5,rh=(h-20)/rows,pl=w*.42,tol=pl*.2*sizeMul("laminate"),omega=2.3*speedMul("laminate")+.08*Math.min(S.day,20);
  const done=[];let row=0,cur=[],prevEnd=0,errs=[],t=0,fin=false;
  const pos=t=>prevEnd+Math.sin(t*omega)*pl*.55;
  cv.onpointerdown=e=>{e.preventDefault();if(fin)return;const x=pos(t),er=Math.min(1,Math.abs(x-prevEnd)/tol);errs.push(er);cur.push(x);prevEnd=x+pl;Snd.click(1-er);if(er>.6)vib(30);
    if(prevEnd>=w){done.push(cur);cur=[];row++;prevEnd=row%2?-pl/2:0;if(row>=rows)fin=true;}};
  function plank(x,y,a){c.globalAlpha=a;c.fillStyle="#C99A5B";c.fillRect(x+1,y+2,pl-2,rh-4);c.strokeStyle="#7A4B2A";c.lineWidth=2;c.strokeRect(x+1,y+2,pl-2,rh-4);
    c.lineWidth=1;c.beginPath();c.moveTo(x+8,y+rh*.4);c.lineTo(x+pl-12,y+rh*.4);c.moveTo(x+20,y+rh*.7);c.lineTo(x+pl-30,y+rh*.7);c.stroke();c.globalAlpha=1;}
  timer(28*tm(),tt=>{t=tt;$("#sc").textContent="ряд "+Math.min(row+1,rows)+" / "+rows;
    c.fillStyle="#8E8A84";c.fillRect(0,0,w,h);
    done.forEach((r,i)=>r.forEach(x=>plank(x,10+(rows-1-i)*rh,1)));
    if(!fin){const y=10+(rows-1-row)*rh;cur.forEach(x=>plank(x,y,1));plank(pos(t),y,.7);
      c.strokeStyle="#FFC93C";c.lineWidth=3;c.beginPath();c.moveTo(prevEnd,y);c.lineTo(prevEnd,y+rh);c.stroke();}
    evTick(c,w,h,t,cv);return fin;
  },()=>{const q=errs.reduce((a,e)=>a+1-e,0)/Math.max(rows*3,errs.length);
    endJob(q,q<.5?"Между досками такие щели, что туда провалился пульт от телевизора.":"");});
}
/* ---------- электрика ---------- */
function electricGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);
  const COLS=["#C8352E","#1F4FA8","#FFC93C","#1E8A5A"],R=S.job.nigora?1:3;let round=0,correct=0,wrong=0,links=[],right=[],drag=null,spark=0;
  const newRound=()=>{links=[];right=[0,1,2,3].sort(()=>Math.random()-.5);};newRound();
  const ly=i=>50+i*(h-100)/3,lx=36,rx=w-36;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{const [x,y]=pos(e);for(let i=0;i<4;i++)if(Math.hypot(x-lx,y-ly(i))<32&&!links.some(l=>l[0]===i)){drag={i,x,y};cv.setPointerCapture(e.pointerId);}};
  cv.onpointermove=e=>{if(!drag)return;const [x,y]=pos(e),j=shake();drag.x=x+(Math.random()-.5)*j;drag.y=y+(Math.random()-.5)*j;};
  cv.onpointerup=cv.onpointercancel=()=>{if(!drag)return;const {i,x,y}=drag;drag=null;
    for(let j=0;j<4;j++)if(Math.hypot(x-rx,y-ly(j))<36){if(links.some(l=>l[1]===j))break;
      if(right[j]===i){links.push([i,j]);correct++;Snd.click(1);}else{wrong++;spark=1;Snd.tone(1800,.25,"sawtooth",.06,200);vib(120);}break;}
    if(links.length===4){round++;Snd.chime();if(round<R)newRound();}};
  timer(26*tm(),t=>{$("#sc").textContent=correct+" / "+R*4;
    c.fillStyle="#2B2F36";c.fillRect(0,0,w,h);c.fillStyle="#3B4048";c.fillRect(w*.25,20,w*.5,h-40);
    c.fillStyle="#A9B8CC";c.font="500 14px BiliBody,Rubik,sans-serif";c.fillText("Щиток "+Math.min(round+1,R)+" из "+R,w*.25+10,40);
    links.forEach(([i,j])=>{c.strokeStyle=COLS[i];c.lineWidth=7;c.beginPath();c.moveTo(lx,ly(i));c.bezierCurveTo(w/2,ly(i),w/2,ly(j),rx,ly(j));c.stroke();});
    if(drag){c.strokeStyle=COLS[drag.i];c.lineWidth=7;c.beginPath();c.moveTo(lx,ly(drag.i));c.lineTo(drag.x,drag.y);c.stroke();}
    for(let i=0;i<4;i++){c.fillStyle=COLS[i];c.beginPath();c.arc(lx,ly(i),14,0,7);c.fill();c.fillStyle=COLS[right[i]];c.beginPath();c.arc(rx,ly(i),14,0,7);c.fill();}
    if(spark>.05){c.fillStyle=`rgba(255,255,200,${spark*.7})`;c.fillRect(0,0,w,h);c.font="54px sans-serif";c.fillText("⚡",w/2-24,h/2+18);}spark*=.9;
    evTick(c,w,h,t,cv);return round>=R;
  },()=>{const q=correct/(R*4)-wrong*.08;endJob(q,wrong>2?"Билибиджона трижды ударило током. Теперь у него причёска как у одуванчика.":"");});
}
/* ---------- сантехника ---------- */
function plumbingGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.15);
  const N=4,pad=22,cs=(w-pad*2)/N,oy=(h-cs*N)/2+8,T=(S.job.nigora?36:24)*tm();
  const rot=m=>((m<<1)|(m>>3))&15,OPP={1:4,4:1,2:8,8:2};
  const seq=[];let r=Math.floor(Math.random()*N);const r0=r;
  for(let col=0;col<N;col++){const rt=Math.floor(Math.random()*N),st=rt>=r?1:-1;for(let y=r;;y+=st){seq.push([col,y]);if(y===rt)break;}r=rt;}
  const rEnd=r,dir=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1];return dx===1?2:dx===-1?8:dy===-1?1:4;};
  const grid=[];for(let i=0;i<N*N;i++){let m=Math.random()<.5?5:3;for(let k=Math.floor(Math.random()*4);k>0;k--)m=rot(m);grid.push(m);}
  seq.forEach((cell,i)=>{const prev=i?seq[i-1]:[cell[0]-1,cell[1]],next=i<seq.length-1?seq[i+1]:[cell[0]+1,cell[1]],tg=dir(cell,prev)|dir(cell,next);
    let m=(tg===5||tg===10)?5:3;for(let k=Math.floor(Math.random()*4);k>0;k--)m=rot(m);if(m===tg)m=rot(m);grid[cell[1]*N+cell[0]]=m;});
  let tDone=null,t=0,flowSet=new Set();
  function flow(){const v=new Set();if(!(grid[r0*N]&8))return v;const q=[[0,r0]];v.add(r0*N);
    while(q.length){const [x,y]=q.pop(),m=grid[y*N+x];for(const d of [1,2,4,8]){if(!(m&d))continue;const nx=x+(d===2)-(d===8),ny=y+(d===4)-(d===1);
      if(nx<0||ny<0||nx>=N||ny>=N)continue;const k=ny*N+nx;if(!v.has(k)&&(grid[k]&OPP[d])){v.add(k);q.push([nx,ny]);}}}return v;}
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=Math.floor((e.clientX-b.left-pad)/cs),y=Math.floor((e.clientY-b.top-oy)/cs);
    if(x<0||y<0||x>=N||y>=N)return;grid[y*N+x]=rot(grid[y*N+x]);Snd.click(.6);};
  timer(T,tt=>{t=tt;flowSet=flow();const ok=flowSet.has(rEnd*N+N-1)&&(grid[rEnd*N+N-1]&2);
    $("#sc").textContent="💧 "+Math.round(t/T*100)+"%";
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);
    for(let i=0;i<N*N;i++){const x=pad+(i%N)*cs,y=oy+Math.floor(i/N)*cs,m=grid[i];c.fillStyle=css("--tile-2");c.fillRect(x+2,y+2,cs-4,cs-4);
      c.strokeStyle=flowSet.has(i)?"#3BA3E8":"#8A8F98";c.lineWidth=cs*.26;c.lineCap="round";const cx=x+cs/2,cy=y+cs/2;
      c.beginPath();if(m&1){c.moveTo(cx,cy);c.lineTo(cx,y);}if(m&2){c.moveTo(cx,cy);c.lineTo(x+cs,cy);}if(m&4){c.moveTo(cx,cy);c.lineTo(cx,y+cs);}if(m&8){c.moveTo(cx,cy);c.lineTo(x,cy);}c.stroke();c.lineCap="butt";}
    c.font="22px sans-serif";c.fillText("🚰",0,oy+r0*cs+cs/2+8);c.fillText("🛁",w-24,oy+rEnd*cs+cs/2+8);
    const lv=t/T;c.fillStyle="rgba(59,163,232,.3)";c.fillRect(0,h*(1-lv),w,h*lv);
    evTick(c,w,h,t,cv);if(ok){tDone=t;return true;}
  },()=>{const q=tDone!==null?1-.35*(tDone/T):.5*seq.filter(([x,y])=>flowSet.has(y*N+x)).length/seq.length;
    endJob(q,tDone===null?"Соседи снизу приплыли ругаться на надувном матрасе.":"");});
}
/* ---------- гипсокартон / полка ---------- */
function drywallGame(short){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1);
  const easy=!!short,D=(short?8:13)*tm(),screws=short?4:6,inst=(easy?.15:1.5)*speedMul("drywall"),noise=(easy?.9:1)*(1+shake()/12),FALL=easy?1:.75,OKA=easy?.45:.35,DAMP=easy?.95:.985;
  let ang=(Math.random()-.5)*.12,vel=0,ctrl=0,sum=0,n=0,fell=false,last=0;
  const setC=e=>{const b=cv.getBoundingClientRect();ctrl=clamp((e.clientX-b.left-w/2)/(w/2),-1,1);};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);setC(e)};cv.onpointermove=e=>{if(e.buttons||e.pointerType==="touch")setC(e)};cv.onpointerup=cv.onpointercancel=()=>ctrl=0;
  timer(D,t=>{const dt=Math.min(.05,t-last);last=t;
    vel+=(ang*inst*3+(Math.random()-.5)*noise*3-ctrl*3.2)*dt;vel*=DAMP;ang+=vel*dt;if(Math.abs(ang)>FALL)fell=true;
    sum+=1-Math.min(1,Math.abs(ang)/OKA);n++;const sd=Math.min(screws,Math.floor(t/D*(screws+.5)));
    $("#sc").textContent=sd+" / "+screws+" саморезов";
    c.fillStyle="#CFC9BE";c.fillRect(0,0,w,h);c.fillStyle="#8E8A84";c.fillRect(0,h*.86,w,h);
    if(short==="lamp"){c.save();c.translate(w/2,h*.12);c.rotate(ang);c.strokeStyle="#14213D";c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.lineTo(0,h*.3);c.stroke();
      c.fillStyle="#FFC93C";c.beginPath();c.ellipse(0,h*.36,w*.2,h*.07,0,0,7);c.fill();c.stroke();c.font="22px sans-serif";c.textAlign="center";c.fillText("💡",-w*.1,h*.5);c.fillText("💡",w*.1,h*.5);c.textAlign="start";
      c.fillStyle="#14213D";for(let k=0;k<sd;k++){c.beginPath();c.arc(-12+k*8,4,3,0,7);c.fill();}c.restore();}
    else{
    c.save();c.translate(w/2,h*.86);c.rotate(ang);
    const sw=short?w*.6:w*.62,sh=short?h*.07:h*.7,sy=short?-h*.45:-sh;
    c.fillStyle=short?"#C99A5B":"#E9E6DF";c.strokeStyle="#14213D";c.lineWidth=3;c.fillRect(-sw/2,sy,sw,sh);c.strokeRect(-sw/2,sy,sw,sh);
    if(short){c.fillStyle="#7A4B2A";c.fillRect(-sw/2+10,sy+sh,8,h*.45-sh);c.fillRect(sw/2-18,sy+sh,8,h*.45-sh);}
    c.fillStyle="#14213D";for(let k=0;k<sd;k++){const px=-sw/2+sw*((k%3)+.5)/3,py=short?sy+sh/2:sy+sh*(Math.floor(k/3)?.8:.2);c.beginPath();c.arc(px,py,4,0,7);c.fill();}
    c.restore();}
    const lw=w-60;c.fillStyle=css("--tape");c.fillRect(30,12,lw,20);c.strokeStyle=css("--ink");c.lineWidth=2;c.strokeRect(30,12,lw,20);
    c.fillStyle="rgba(30,138,90,.4)";c.fillRect(30+lw/2-lw*.1,14,lw*.2,16);c.fillStyle="#E8FFF5";c.beginPath();c.arc(30+lw/2+clamp(ang/FALL,-1,1)*(lw/2-10),22,8,0,7);c.fill();c.stroke();
    evTick(c,w,h,t,cv);return fell;
  },()=>{let q=n?sum/n:0;if(fell)q*=.5;
    endJob(q,fell?(short==="lamp"?"Люстра повисла на одном проводе. Нигора сказала, что так даже уютнее.":short?"Полка упала. Нигора смеётся, Билибиджон тоже.":S.helper?"Лист упал на Фарходa. Фарход жив, лист — нет.":"Лист упал Билибиджону на ногу. Нога жива. Лист — нет."):"");});
}
/* ---------- кирпич ---------- */
function brickGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.25);
  const total=12,pw=74*sizeMul("brick"),py=h-34,gr=h*1.4*speedMul("brick"),v0=Math.sqrt(2*gr*h*.72);
  let px=w/2,bricks=[],thrown=0,caught=0,next=.6,last=0;
  const setX=e=>{const b=cv.getBoundingClientRect();px=e.clientX-b.left+(Math.random()-.5)*shake();};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);setX(e)};cv.onpointermove=e=>{if(e.buttons||e.pointerType==="touch")setX(e)};
  timer(total*1.7/speedMul("brick")+5,t=>{const dt=Math.min(.05,t-last);last=t;
    if(thrown<total&&t>=next){bricks.push({x:40+Math.random()*(w-80),y:h+20,vx:(Math.random()-.5)*w*.3,vy:-v0,a:0});thrown++;next=t+Math.max(.8,1.4-S.day*.02)*speedMul("brick");Snd.tone(300,.15,"triangle",.03,600);}
    for(const b of bricks){b.vy+=gr*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=dt*5;if(b.x<15||b.x>w-15)b.vx*=-1;
      if(!b.done&&b.vy>0&&b.y>=py-16&&b.y<=py+18&&Math.abs(b.x-px)<pw/2+14){b.done=1;caught++;Snd.click(1);}
      if(!b.done&&b.vy>0&&b.y>h+20){b.done=1;Snd.fail();vib(40);}}
    bricks=bricks.filter(b=>!b.done);$("#sc").textContent=caught+" / "+total;
    c.fillStyle="#BFE3F5";c.fillRect(0,0,w,h);c.fillStyle="#8BC36A";c.fillRect(0,h-20,w,20);
    const bw=(w-20)/6;for(let k=0;k<caught;k++){const rr=Math.floor(k/6),cc=k%6,ox=rr%2?bw/2:0;c.fillStyle="#B5482F";c.fillRect(10+cc*bw+ox-(rr%2&&cc===5?bw/2:0),14+rr*22,bw-4,18);}
    for(const b of bricks){c.save();c.translate(b.x,b.y);c.rotate(b.a);c.fillStyle="#B5482F";c.fillRect(-17,-8,34,16);c.strokeStyle="#5A2316";c.lineWidth=2;c.strokeRect(-17,-8,34,16);c.restore();}
    c.fillStyle="#B8C2CC";c.strokeStyle="#14213D";c.lineWidth=2;c.fillRect(px-pw/2,py,pw,10);c.strokeRect(px-pw/2,py,pw,10);c.fillStyle="#7A4B2A";c.fillRect(px-5,py+10,10,16);
    evTick(c,w,h,t,cv);return thrown>=total&&!bricks.length;
  },()=>{const q=caught/total;endJob(q,q<.5?"Кирпичи лежат по всему двору. Двор теперь тоже кирпичный.":"");});
}
/* ---------- курьер ---------- */
function courierGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.3);
  const L=3,lw=w/L,py=h-70,IC=["💧","🐦","👵","🚧"];let lane=1,pizza=100,obs=[],next=.8,last=0,scroll=0,flash=0;
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect();lane=clamp(lane+((e.clientX-b.left)<w/2?-1:1),0,L-1);Snd.step();};
  timer(22,t=>{const dt=Math.min(.05,t-last);last=t;const v=h*(.55+t*.025)/speedMul("courier");scroll=(scroll+v*dt)%40;
    if(t>=next){obs.push({l:Math.floor(Math.random()*L),y:-30,e:rnd(IC)});if(Math.random()<.25+t*.01)obs.push({l:Math.floor(Math.random()*L),y:-110,e:rnd(IC)});next=t+Math.max(.45,.95-t*.02);}
    for(const o of obs){o.y+=v*dt;if(!o.hit&&o.l===lane&&o.y>py-34&&o.y<py+20){o.hit=1;pizza=Math.max(0,pizza-18);flash=1;Snd.fail();vib(80);}}
    obs=obs.filter(o=>o.y<h+40);$("#sc").textContent="🍕 "+pizza+"%";
    c.fillStyle="#55585E";c.fillRect(0,0,w,h);c.strokeStyle="#E8E8E0";c.lineWidth=3;c.setLineDash([20,20]);c.lineDashOffset=-scroll;
    for(let k=1;k<L;k++){c.beginPath();c.moveTo(k*lw,0);c.lineTo(k*lw,h);c.stroke();}c.setLineDash([]);
    c.font="32px sans-serif";c.textAlign="center";for(const o of obs)if(!o.hit)c.fillText(o.e,o.l*lw+lw/2,o.y);
    c.fillText("🛴",lane*lw+lw/2,py+16);c.font="20px sans-serif";c.fillText("🍕",lane*lw+lw/2+16,py-12);c.textAlign="start";
    if(flash>.05){c.fillStyle=`rgba(200,53,46,${flash*.4})`;c.fillRect(0,0,w,h);}flash*=.9;
    return pizza<=0;
  },()=>endJob(pizza/100,""));
}
/* ---------- дворник ---------- */
function sweepGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.15),winter=season()===3;
  let items=[];const add=k=>{for(let i=0;i<k;i++)items.push({x:12+Math.random()*(w-24),y:12+Math.random()*(h-24),e:Math.random()<.5});};add(40);
  const st={},r=26*sizeMul("sweep");let gust=3,wind=0;
  dragInput(cv,(x,y)=>{const n0=items.length;items=items.filter(o=>(o.x-x)**2+(o.y-y)**2>r*r);if(items.length<n0)Snd.squish();},st);
  timer(20*tm(),t=>{if(t>gust){add(winter?5:7);gust=t+2.5+Math.random()*1.5;wind=1;Snd.tone(220,.5,"sawtooth",.02,80);}
    $("#sc").textContent=items.length+(winter?" сугробов":" листьев");
    c.fillStyle=winter?"#EEF4F8":"#9C8F7A";c.fillRect(0,0,w,h);
    if(winter){c.fillStyle="#FFFFFF";for(const o of items){c.beginPath();c.arc(o.x,o.y,9,0,7);c.fill();c.strokeStyle="#C9D6E0";c.lineWidth=1;c.stroke();}}
    else{c.font="20px sans-serif";for(const o of items)c.fillText(o.e?"🍂":"🍁",o.x-10,o.y+7);}
    if(wind>.05){c.font="36px sans-serif";c.globalAlpha=wind;c.fillText("💨",w*(1-wind)-20,h/2);c.globalAlpha=1;}wind*=.96;
    if(st.down){c.font="30px sans-serif";c.fillText("🧹",st.x-15,st.y+10);}
    return false;
  },()=>endJob(clamp(1-items.length/25,0,1),winter?"Зима. Снег падал быстрее, чем Билибиджон успевал думать.":""));
}
/* ---------- грузчик ---------- */
function moverGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.15);
  const N=10,win=1.3/speedMul("mover");let i=0,start=.8,need=null,score=[],msg="Поднимаем! Раз-два…",t=0;
  cv.onpointerdown=e=>{e.preventDefault();if(need===null)return;const b=cv.getBoundingClientRect(),side=(e.clientX-b.left)<w/2?-1:1;
    if(side===need){score.push(1-.5*(t-start)/win);msg="Прошли поворот!";Snd.click(1);}else{score.push(0);msg="Диван застрял в перилах!";Snd.fail();vib(100);}
    i++;start=t+.6;need=null;};
  timer(N*(win+.7)+2,tt=>{t=tt;
    if(need===null&&i<N&&t>=start){need=Math.random()<.5?-1:1;msg="Пиво-о-от!";Snd.tone(620,.12,"square",.05);}
    if(need!==null&&t>start+win){score.push(0);msg="Не успели — диван упёрся в стену.";Snd.fail();vib(60);i++;start=t+.6;need=null;}
    $("#sc").textContent="этаж "+Math.min(9,1+Math.floor(i*.9))+" / 9";
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);
    const fl=5,fh=(h-60)/fl;c.strokeStyle=css("--muted");c.lineWidth=3;
    for(let k=0;k<fl;k++){const y=h-20-k*fh;c.beginPath();if(k%2){c.moveTo(w-30,y);c.lineTo(30,y-fh);}else{c.moveTo(30,y);c.lineTo(w-30,y-fh);}c.stroke();}
    const p=i/N,k=Math.min(fl-1,Math.floor(p*fl)),f=p*fl-k,y=h-20-(k+f)*fh,x=k%2?w-30-(w-60)*f:30+(w-60)*f;
    c.font="40px sans-serif";c.fillText("🛋️",x-20,y-4);
    c.fillStyle=css("--ink");c.font="500 16px BiliBody,Rubik,sans-serif";c.fillText(msg,14,26);
    if(need!==null){c.font="64px sans-serif";c.fillText(need<0?"⬅️":"➡️",w/2-32,h/2);}
    return i>=N;
  },()=>{while(score.length<N)score.push(0);endJob(score.reduce((a,b)=>a+b,0)/N,"");});
}
/* ---------- мойка ---------- */
function carwashGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,.9),black=S.rep>=45&&Math.random()<.4;
  const gx=14,gy=7,cw=w/gx,ch=(h*.62)/gy,oy=h*.12,cells=[];let total=0,t=0;
  const inCar=(x,y)=>(x>=1&&x<=12&&y>=3&&y<=6)||(x>=4&&x<=9&&y>=1&&y<=2);
  for(let i=0;i<gx*gy;i++){const x=i%gx,y=Math.floor(i/gx),hp=inCar(x,y)&&Math.random()<.75?1+Math.floor(Math.random()*(black?3:2)):0;cells.push({hp,cd:0});total+=hp;}
  const st={},r=22*sizeMul("carwash");
  dragInput(cv,(x,y)=>{for(let i=0;i<cells.length;i++){const C=cells[i];if(!C.hp||C.cd>t)continue;const cx=(i%gx+.5)*cw,cy=oy+(Math.floor(i/gx)+.5)*ch;
    if((cx-x)**2+(cy-y)**2<r*r){C.hp--;C.cd=t+.18;Snd.squish();}}},st);
  timer(20*tm(),tt=>{t=tt;const left=cells.reduce((a,C)=>a+C.hp,0);$("#sc").textContent=Math.round((1-left/total)*100)+"%";
    c.fillStyle="#BFE3F5";c.fillRect(0,0,w,h);c.fillStyle="#8A8F98";c.fillRect(0,oy+ch*7,w,h);
    for(let i=0;i<cells.length;i++){const x=i%gx,y=Math.floor(i/gx);if(!inCar(x,y))continue;c.fillStyle=y<=2&&x>=5&&x<=8?"#9FD3F2":black?"#1B1E24":"#C8352E";c.fillRect(x*cw,oy+y*ch,cw+.5,ch+.5);}
    c.fillStyle="#14213D";[3,11].forEach(x=>{c.beginPath();c.arc(x*cw,oy+7*ch,ch*.9,0,7);c.fill();});
    for(let i=0;i<cells.length;i++){const C=cells[i];if(!C.hp)continue;c.fillStyle=`rgba(${black?"220,210,190":"110,80,40"},${.25+.22*C.hp})`;c.beginPath();c.arc((i%gx+.5)*cw,oy+(Math.floor(i/gx)+.5)*ch,cw*.5,0,7);c.fill();}
    if(st.down){c.font="30px sans-serif";c.fillText("🧽",st.x-15,st.y+10);}
    return left===0;
  },()=>{const left=cells.reduce((a,C)=>a+C.hp,0);endJob(1-left/total,black?"Это была чёрная машина Эдика. На ней видно ВСЁ.":"");});
}
/* ---------- склад ---------- */
function warehouseGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1);
  const COL=["#C8352E","#1F4FA8","#1E8A5A"],NAMES=["Носки","Телевизоры","Пельмени"],by=h*.3,bs=46,shW=(w-20)/3;
  let boxes=[],ok=0,bad=0,missed=0,last=0,flash=0,scroll=0;
  const front=()=>boxes.reduce((f,b,i)=>b.x>boxes[f].x?i:f,0);
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;if(y<h-110||!boxes.length)return;
    const k=clamp(Math.floor((x-10)/shW),0,2),fi=front(),f=boxes[fi];boxes.splice(fi,1);if(f.c===k){ok++;Snd.click(1);}else{bad++;flash=1;Snd.fail();vib(60);}};
  timer(22,t=>{const dt=Math.min(.05,t-last);last=t;const v=w*(.22+t*.013)/speedMul("warehouse");scroll=(scroll+v*dt)%30;
    if(!boxes.length||Math.min(...boxes.map(b=>b.x))>bs+30)boxes.push({x:-bs-Math.random()*40,c:Math.floor(Math.random()*3)});
    boxes.forEach(b=>b.x+=v*dt);const n0=boxes.length;boxes=boxes.filter(b=>b.x<w);if(boxes.length<n0){missed+=n0-boxes.length;Snd.fail();}
    $("#sc").textContent="✓ "+ok+"  ✗ "+(bad+missed);
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle="#3B3F46";c.fillRect(0,by+bs,w,14);
    c.strokeStyle="#8A8F98";c.lineWidth=2;for(let x=-30+scroll;x<w;x+=30){c.beginPath();c.moveTo(x,by+bs);c.lineTo(x+10,by+bs+14);c.stroke();}
    const fi=boxes.length?front():-1;
    boxes.forEach((b,i)=>{c.fillStyle=COL[b.c];c.fillRect(b.x,by,bs,bs);c.strokeStyle=i===fi?"#FFC93C":"#14213D";c.lineWidth=i===fi?5:2;c.strokeRect(b.x,by,bs,bs);});
    for(let k=0;k<3;k++){const x=10+k*shW;c.fillStyle=COL[k];c.fillRect(x+3,h-100,shW-6,90);c.fillStyle="#fff";c.font="500 14px BiliBody,Rubik,sans-serif";c.fillText(NAMES[k],x+10,h-50);}
    if(flash>.05){c.fillStyle=`rgba(200,53,46,${flash*.35})`;c.fillRect(0,0,w,h);}flash*=.9;
    return false;
  },()=>endJob(ok/Math.max(12,ok+bad+missed),""));
}
/* ---------- спор с Валерой (ритм) ---------- */
const B_LINES=["Валера, где деньги?!","Я всё положил ровно!","Мы договаривались!","Мама ждёт перевод!","Плитка итальянская!","Я записал всё в тетрадку!"];
const V_LINES=["Денег нет, но ты держись","Завтра отдам. Честно.","Это не я, это кризис","Плитка какая-то не такая","У меня кот заболел","Подпиши ещё раз, я потерял"];
function argueGame(onDone){
  $("#screen").innerHTML=`<div class="panel"><h2>Спор с прорабом Валерой</h2><p class="log">Жми, когда сжимающийся круг совпадёт с жёлтым кольцом. Каждое попадание — железный аргумент.${DESKTOP?" ⌨️ Пробел.":""}</p><div class="hud"><span id="tm">--</span><span id="sc">0 / 8</span></div><canvas id="cv"></canvas></div>`;
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,.95),N=8,life=1.15*(S.nasActive?1.15:1)*(S.withdraw?.85:1),TR=34;
  let i=0,start=.6,scores=[],line="Валера: «Какие деньги?»",tapped=false,t=0;
  const radius=tt=>110-100*((tt-start)/life);
  cv.onpointerdown=e=>{e.preventDefault();if(tapped||t<start||i>=N)return;const r=radius(t),err=Math.abs(r-TR),s=Math.max(0,1-err/26);
    tapped=true;scores.push(s);line=s>.5?"Билибиджон: «"+rnd(B_LINES)+"»":"Валера: «"+rnd(V_LINES)+"»";s>.5?Snd.click(1):(Snd.fail(),vib(40));next();};
  function next(){i++;start=t+.35;tapped=false;}
  timer(N*(life+.4)+2,tt=>{t=tt;$("#sc").textContent=Math.min(i,N)+" / "+N;
    if(t>=start&&!tapped&&radius(t)<8){scores.push(0);line="Валера: «"+rnd(V_LINES)+"»";Snd.fail();next();}
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);
    c.font="40px sans-serif";c.fillText("👷",16,h-20);c.fillText("🧔",w-60,h-20);
    c.fillStyle=css("--ink");c.font="500 15px BiliBody,Rubik,sans-serif";c.fillText(line,14,26);
    const cx=w/2,cy=h/2+6;c.strokeStyle="#FFC93C";c.lineWidth=8;c.beginPath();c.arc(cx,cy,TR,0,7);c.stroke();
    if(t>=start&&i<N){c.strokeStyle=css("--cobalt");c.lineWidth=4;c.beginPath();c.arc(cx,cy,Math.max(2,radius(t)),0,7);c.stroke();}
    return i>=N;
  },()=>{while(scores.length<N)scores.push(0);onDone(scores.reduce((a,b)=>a+b,0)/N);});
}

function endJob(q,note){
  q=clamp(q,0,1);const J=S.job,C=CLIENTS[J.client];let notes=[];
  if(note)notes.push(note);
  if(S.helper&&!J.finale&&!J.gig&&!J.nigora){q=Math.min(1,q+(1-q)*.25);notes.push("Фарход подправил огрехи за Билибиджоном.");}
  if(!J.finale&&!J.gig&&!J.nigora){if(S.crew.dilshod){q=Math.min(1,q+(1-q)*.35);notes.push("Дилшод всё перепроверил. Медленно, но идеально.");}if(S.crew.shukhrat){q=Math.max(0,q-.05);notes.push("Шухрат всё сделал быстро. Кое-где слишком быстро.");}}
  S.xp[J.type]=(S.xp[J.type]||0)+1+(q>.8?1:0);S.stats.jobs++;
  if(!S.stats.types.includes(J.type))S.stats.types.push(J.type);
  if(J.obj){const O=S.obj;O.scores.push(q);O.i++;
    if(O.i<O.st.length){notes.push(`${O.e} Этап ${O.i} из ${O.st.length} на объекте ${O.name}: ${Math.round(q*100)}%. Оплата — после комиссии.`);
      S.result={q,pay:0,notes,dr:0,valeraDone:true,qDone:true,question:null,label:O.name};}
    else{S.comPending="obj";notes.push(`${O.e} Все работы на объекте ${O.name} закончены! Впереди — приёмочная комиссия.`);
      S.result={q,pay:0,notes,dr:0,valeraDone:true,qDone:true,question:null,label:O.name,back:"commission"};}
    S.phase="result";q>.6?Snd.coin():Snd.fail();return render();}
  if(J.show){const SH=S.show;SH.scores.push(q);SH.i++;
    if(SH.i<SH.types.length){notes.push(`🎬 Этап ${SH.i} из 3: ${Math.round(q*100)}%. Ведущий: «${rnd(TV_LINES)}»`);S.result={q,pay:0,notes,dr:0,valeraDone:true,qDone:true,question:null,back:"show",label:"Ремонт за 24 часа"};}
    else{const avg=SH.scores.reduce((a,b)=>a+b,0)/SH.scores.length,pay=Math.round(700*avg),fol=Math.round(3000*avg),dr=Math.round(8*avg-2);
      S.money+=pay;S.stats.earned+=pay;S.blog.followers+=fol;S.rep=clamp(S.rep+dr,0,100);
      notes.push(`🎬 Финал шоу! Средний результат ${Math.round(avg*100)}%. Гонорар ${pay}₽ и +${fol} подписчиков.`,avg>.75?"Ведущий плакал. Оператор тоже. Выпуск стал хитом.":"Выпуск смонтировали как комедию. Рейтинги всё равно высокие.");
      if(avg>=.75)unlock("tv");if(S.blog.followers>=1000)unlock("blogger");S.show=null;
      S.result={q:avg,pay,notes,dr,valeraDone:true,qDone:true,question:null,label:"Ремонт за 24 часа"};}
    S.phase="result";q>.6?Snd.coin():Snd.fail();return render();}
  if(J.duel){const sq=clamp(.55+Math.random()*.3+Math.min(S.day,40)*.003+S.sergey.w*.02,0,.97),win=q>sq,pay=win?Math.round(250+150*q):0,dr=win?6:-3;
    S.money+=pay;S.stats.earned+=pay;S.rep=clamp(S.rep+dr,0,100);
    notes.push(`😤 Сергей: ${Math.round(sq*100)}%. Билибиджон: ${Math.round(q*100)}%.`,win?`Победа! Сергей сказал «просто повезло» и уехал на своей машине с наклейкой «Евроремонт». +${pay}₽.`:"Поражение. Сергей сфоткался на фоне своей плитки и выложил «до/после» с твоей.");
    if(win){S.sergey.w++;S.sergeyBonus=true;if(S.sergey.w>=3)unlock("sergey");}else S.sergey.l++;
    S.result={q,pay,notes,dr,valeraDone:true,qDone:true,question:null,label:"Дуэль с Сергеем",canVideo:!S.blog.today};
    S.phase="result";win?Snd.fanfare():Snd.fail();return render();}
  if(J.finale){S.won=true;S.over="win";S.result={q};Snd.fanfare();vib([80,60,80,60,200]);unlock("home");return render();}
  if(J.gig||J.nigora){
    let pay=0;
    if(J.gig){pay=Math.round(J.base*q*(1+.03*lvl(J.type)));S.happy=clamp(S.happy-5,0,100);notes.push(GIG_NOTES[J.type](q));if(J.type==="courier"&&q>=.95)unlock("pizza");}
    else nigoraResult(J,q,notes);
    if(J.gig){const ins=inspect(.08);if(ins){notes.push(ins.t);if(!ins.ok)pay=0;}}
    S.money+=pay;S.stats.earned+=pay;
    S.result={q,pay,notes,dr:0,valeraDone:true,qDone:true,question:null,back:"evening",label:J.gig?JOBS[J.type].name:"Помощь Нигоре"};
    S.phase="result";q>.6?Snd.coin():Snd.fail();return render();
  }

  if(J.project){
    S.project.scores.push(q);S.project.i++;notes.push(`Этап ${S.project.i} из 3 сделан: ${Math.round(q*100)}%.`);
    if(S.project.i>=3){S.comPending="project";notes.push("🏗️ Все этапы готовы. Эдик позвал приёмочную комиссию. «Лучших специалистов», говорит.");}
    else notes.push("Эдик кивнул. Оплата — после всех этапов.");
  } else {
    if(C.vibe){const v=.3+Math.random()*.7;q=clamp(.4*q+.6*v,0,1);notes.push(`Анжелика: «${v>.75?"Это ВАЙБ! Столько воздуха!":v>.5?"Хм… вайб есть, но не тот. Где воздух?":"Нет вайба. Совсем. Стена не дышит."}»`);}
    pay=Math.round(J.base*C.pay*(J.rec?1.2:1)*q*(1+.04*S.words.length)*(.8+S.rep/250)*(S.blog.followers>=1000?1.05:1)*(season()===3&&["plumbing","electric"].includes(J.type)?1.2:1));
    if(C.valera&&!patentOk()){pay=Math.round(pay*.75);notes.push("Валера взял без патента, но «за риск» срезал четверть оплаты.");}
    const room=/\{(ванная|кухня)\}/.exec(J.text||"");
    if(room&&!S.words.includes(room[1])&&Math.random()<.35){pay=Math.round(pay*.5);notes.push(`Билибиджон всё сделал отлично. Только не в той комнате (заказчик говорил «${room[1]}»).`);}
    if(C.rush){if(q>=.8)unlock("edik");if(q<.5){pay=Math.round(pay*.5);notes.push("Эдику не понравилось. Он заплатил половину и купил себе ещё одну яхту.");}else notes.push("Эдик доволен и щедр. Почти как в кино.");}
    if(C.pies){S.happy=clamp(S.happy+12,0,100);S.stats.pies++;if(!S.ate)S.ate="pies";notes.push("Бабушка Зина доплатила пирожками. Ужин есть, счастье +12.");}
    if(C.crooked&&J.type==="tile"&&q>.7)unlock("hipster");
    if(!S.ate&&(S.stats.nigora||0)>=6&&Math.random()<.2){S.ate="plov";notes.push("🍚 Нигора принесла на объект обед в контейнере. Ужин уже есть!");}
    dr=(q-.55)*16*(C.blog?3:1);
    if(C.blog){if(q>.75){notes.push("Ролик «Плиточник от бога» набрал миллион просмотров!");unlock("viral");}else if(q<.45)notes.push("Ролик «Худший ремонт года» в трендах. Ой.");}
    if(J.night){S.nightPending=true;dr=Math.max(dr,2);notes.push(q>.6?"Потоп остановлен в 3:40 ночи. Соседи снизу прислали торт.":"Вода остановилась сама. Когда кончилась.");if(q>.6)unlock("night");}
    if(J.type==="tile"&&!C.crooked&&q>=.97)unlock("perfect");
    if(q>.9)notes.push("Работа идеальная. Заказчик сказал «спасибо» и что-то ещё, очень длинное.");
  }
  S.rep=clamp(S.rep+dr,0,100);
  if(S.late){pay=Math.round(pay*.85);notes.push("🚐 Опоздал — маршрутка уехала без него. Оплата −15%.");S.late=false;}
  if(!J.project&&Math.random()<.01){pay+=300;S.stats.treasure=(S.stats.treasure||0)+1;unlock("treasure");notes.push("💎 Под старой плиткой нашёлся клад: 300₽! …Это заначка Валеры. Валера пока не знает.");}
  if(!J.night){const ins=inspect(C.valera?.25:.18);if(ins){notes.push(ins.t);if(!ins.ok)pay=0;}}

  S.money+=pay;S.stats.earned+=pay;
  const ask=!C.valera&&!J.night&&!J.project&&Math.random()<.45;
  S.result={q,pay,notes,dr,valera,valeraDone:!valera,question:ask?Math.floor(Math.random()*QUESTIONS.length):null,qText:null,back:J.night?"sleep":null,label:J.night?"Ночной вызов":null};

/* ---------- плитка-матрёшка ---------- */
function matrGame(){
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.05),L=7;
  const LAB=["Слой 1: плитка 2010-х","Слой 2: «под мрамор»","Слой 3: 1990-е, с ромашками","Слой 4: советский кафель","Слой 5: ещё советский кафель","Слой 6: что-то синее","Слой 7: …там что-то есть"];
  const COL=["#9ED8C8","#EFE6C8","#F2F2EC","#9FD3F2","#B9E3C6","#1F4FA8","#8A6E4B"];
  let layer=0,cells=[],t=0;const hpOf=()=>1+Math.floor(layer/3),newLayer=()=>{cells=Array(9).fill(hpOf());};newLayer();
  const cs=Math.min((w-40)/3,(h-70)/3),ox=(w-cs*3)/2,oy=50;
  cv.onpointerdown=e=>{e.preventDefault();if(layer>=L)return;const b=cv.getBoundingClientRect(),x=Math.floor((e.clientX-b.left-ox)/cs),y=Math.floor((e.clientY-b.top-oy)/cs);
    if(x<0||y<0||x>2||y>2)return;const i=y*3+x;if(cells[i]<=0)return;cells[i]--;Snd.tone(500+layer*60,.06,"square",.05);vib(15);
    if(cells.every(v=>v<=0)){layer++;Snd.chime();if(layer<L)newLayer();}};
  timer(24*tm(),tt=>{t=tt;$("#sc").textContent="слой "+Math.min(layer+1,L)+" / "+L;
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle=css("--ink");c.font="500 15px BiliBody,Rubik,sans-serif";
    c.fillText(layer<L?LAB[layer]:"📜 Под последним слоем что-то есть…",14,30);
    const under=layer+1<L?COL[layer+1]:"#C9B48A";
    for(let i=0;i<9;i++){const x=ox+(i%3)*cs,y=oy+Math.floor(i/3)*cs;c.fillStyle=under;c.fillRect(x+3,y+3,cs-6,cs-6);
      if(layer<L&&cells[i]>0){c.fillStyle=COL[layer];c.fillRect(x+3,y+3,cs-6,cs-6);c.strokeStyle=css("--ink");c.lineWidth=2;c.strokeRect(x+3,y+3,cs-6,cs-6);
        if(cells[i]<hpOf()){c.strokeStyle="#14213D";c.beginPath();c.moveTo(x+10,y+10);c.lineTo(x+cs/2,y+cs/2);c.lineTo(x+cs-14,y+cs*.3);c.stroke();}}}
    if(layer>=L){c.font="60px sans-serif";c.fillText("📜",w/2-30,oy+cs*1.5+20);}
    evTick(c,w,h,t,cv);return layer>=L;
  },()=>{if(layer>=L)unlock("matryoshka");
    endJob(layer/L,layer>=L?`📜 Под седьмым слоем — записка: «Кто это читает — привет из 1972-го. Клал криво, простите. Плиточник Толик». Билибиджон оставил рядом свою: «Положу ровно. Билибиджон».`:`Отбито слоёв: ${layer} из ${L}. Что под остальными — тайна.`);});
}
/* ---------- нарды ---------- */
function nardyGame(){
  const M=S.mini;if(M.r==null){M.r=0;M.me=0;M.ru=0;M.lg=[];}
  const F=["⚀","⚁","⚂","⚃","⚄","⚅"],d=()=>1+Math.floor(Math.random()*6),over=M.me>=2||M.ru>=2;
  $("#screen").innerHTML=`<div class="panel"><h2>🎲 Нарды с Рустамом</h2><p class="log">По-простому: у кого больше на двух кубиках. До двух побед.${M.bet?"":" Играете при свечах."}</p>
    <p class="big" style="text-align:center">${M.me} : ${M.ru}</p><p class="who" style="text-align:center">Билибиджон · Рустам</p>
    ${M.last?`<p style="font-size:2.6rem;text-align:center;margin:.2em 0">${M.last}</p>`:""}${M.lg.slice(0,3).map(l=>`<p class="log">${l}</p>`).join("")}
    ${over?`<button class="main" id="nEnd">${M.me>=2?"Забрать выигрыш":"Вернуться"}</button>`:`<button class="main" id="nRoll">🎲 Бросить кости</button>`}</div>`;
  if(!over)$("#nRoll").onclick=()=>{const a=d(),b=d();let x=d(),y=d(),cheat="";
    if(x+y<a+b&&Math.random()<.3){x=d();y=d();cheat=" Рустам «случайно» уронил кости и перебросил.";}
    const me=a+b,ru=x+y;M.last=`${F[a-1]}${F[b-1]} · ${F[x-1]}${F[y-1]}`;
    if(me>ru){M.me++;M.lg.unshift(`Ты: ${me}, Рустам: ${ru}. Очко тебе!${cheat}`);Snd.click(1);}
    else if(ru>me){M.ru++;M.lg.unshift(`Ты: ${me}, Рустам: ${ru}. Рустам запел победную песню.${cheat}`);Snd.fail();}
    else M.lg.unshift(`Ничья: ${me}. Перебрасываем.`);
    nardyGame();};
  else $("#nEnd").onclick=()=>{S.phase="evening";const won=M.me>=2,prize=M.bet?M.bet*2:20;
    if(won){S.money+=prize;S.stats.nardy=(S.stats.nardy||0)+1;if(S.stats.nardy>=3)unlock("nardy");S.log.unshift(`🎲 Обыграл Рустама в нарды: +${prize}₽. Рустам требует реванш завтра.`);Snd.coin();}
    else S.log.unshift("🎲 Рустам выиграл и в честь победы спел ещё раз. Ту же песню.");
    S.mini=null;render();};
}

function pigeonGame(){
  $("#screen").innerHTML=`<div class="panel"><h2>🕵️ Охота на голубя</h2><p class="log">Голубь мечется по двору. Тапни по нему 5 раз, чтобы проследить до гнезда.</p><div class="hud"><span id="tm">--</span><span id="sc"></span></div><canvas id="cv"></canvas></div>`;
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,1.1);let x=w/2,y=h/2,vx=120,vy=90,hits=0,flash=0,last=0;
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect();if(Math.hypot(e.clientX-b.left-x,e.clientY-b.top-y)<40){hits++;flash=1;Snd.click(1);vib(30);vx=(Math.random()-.5)*500;vy=(Math.random()-.5)*500;}else Snd.tone(300,.05,"triangle",.03);};
  timer(14,t=>{const dt=Math.min(.05,t-last);last=t;const sp=(1+hits*.25)/speedMul("pigeon");
    if(Math.random()<.02){vx+=(Math.random()-.5)*300;vy+=(Math.random()-.5)*300;}
    const m=Math.hypot(vx,vy)||1;vx=vx/m*200*sp;vy=vy/m*200*sp;x+=vx*dt;y+=vy*dt;
    if(x<22||x>w-22)vx*=-1;if(y<22||y>h-22)vy*=-1;x=clamp(x,22,w-22);y=clamp(y,22,h-22);
    c.fillStyle="#9C8F7A";c.fillRect(0,0,w,h);c.font="24px sans-serif";["🌳","🗑️","🚗"].forEach((e,i)=>c.fillText(e,24+i*(w/3),h-16));
    c.font="38px sans-serif";c.textAlign="center";c.fillText("🕊️",x,y+12);c.textAlign="start";
    if(flash>.05){c.strokeStyle=`rgba(255,201,60,${flash})`;c.lineWidth=4;c.beginPath();c.arc(x,y,30,0,7);c.stroke();}flash*=.9;
    $("#sc").textContent=hits+" / 5";return hits>=5;
  },()=>{S.phase="evening";S.mini=null;
    if(hits>=5){S.nestFound=true;const loot=50+S.pigeon*10;S.money+=loot;S.happy=clamp(S.happy+15,0,100);unlock("pigeon");Snd.fanfare();
      S.log.unshift(`🕊️ Гнездо найдено! Внутри: ${S.pigeon} лепёшек, самса, ключи от чьей-то машины и ${loot}₽. Голубь смотрит с уважением.`);}
    else{S.log.unshift("🕊️ Голубь ушёл. Он вернётся. Они всегда возвращаются.");Snd.fail();}
    render();});
}

function commuteGame(){
  $("#screen").innerHTML=`<div class="panel"><h2>🚐 Маршрутка</h2><p class="log">Маршрутка уже набита. Втисни всех по очереди: тапни клетку, куда встанет левый верхний угол. «↻» поворачивает.</p><div class="hud"><span id="tm">--</span><span id="sc"></span></div><canvas id="cv"></canvas><button id="rot">↻ Повернуть</button></div>`;

  const pieces=[{e:"👷",n:"Билибиджон",w:1,h:2},{e:"🛍️",n:"Мешок шпаклёвки",w:2,h:1},{e:"🪣",n:"Ведро",w:1,h:1}];
  if(S.helper)pieces.splice(1,0,{e:"🧔",n:"Фарход",w:1,h:2});
  function fits(g,x,y,pw,ph){if(x<0||y<0||x+pw>COLS||y+ph>ROWS)return false;for(let a=0;a<pw;a++)for(let b=0;b<ph;b++)if(g[(y+b)*COLS+x+a])return false;return true;}
  function mark(g,x,y,pw,ph,v){for(let a=0;a<pw;a++)for(let b=0;b<ph;b++)g[(y+b)*COLS+x+a]=v;}
  let grid,ok=false;
  for(let tr=0;tr<200&&!ok;tr++){grid=Array(COLS*ROWS).fill(0);ok=true;
    for(const p of pieces){const rt=Math.random()<.5,pw=rt?p.h:p.w,ph=rt?p.w:p.h;let pl=false;
      for(let k=0;k<40&&!pl;k++){const x=Math.floor(Math.random()*(COLS-pw+1)),y=Math.floor(Math.random()*(ROWS-ph+1));if(fits(grid,x,y,pw,ph)){mark(grid,x,y,pw,ph,9);pl=true;}}
      if(!pl)ok=false;}}
  const others=[];grid.forEach((v,i)=>{if(v===9)grid[i]=0;else others.push(i);});
  shuffle(others).slice(1).forEach(i=>grid[i]=1);
  let idx=0,rot=false;const placed=[],cw=(w-20)/COLS,ch=(h-50)/ROWS,ox=10,oy=40;
  $("#rot").onclick=()=>{rot=!rot;Snd.step();};
  cv.onpointerdown=e=>{e.preventDefault();if(idx>=pieces.length)return;const b=cv.getBoundingClientRect(),x=Math.floor((e.clientX-b.left-ox)/cw),y=Math.floor((e.clientY-b.top-oy)/ch);
    const p=pieces[idx],pw=rot?p.h:p.w,ph=rot?p.w:p.h;
    if(fits(grid,x,y,pw,ph)){mark(grid,x,y,pw,ph,2+idx);placed.push({p,x,y,pw,ph});idx++;rot=false;Snd.click(1);}else{Snd.fail();vib(40);}};
  timer(16,t=>{$("#sc").textContent=idx+" / "+pieces.length;
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);const p=pieces[idx];
    c.fillStyle=css("--ink");c.font="500 14px BiliBody,Rubik,sans-serif";c.fillText(p?`Сейчас: ${p.e} ${p.n} (${rot?p.h:p.w}×${rot?p.w:p.h})`:"Все внутри!",12,24);
    c.fillStyle="#F2D35B";c.fillRect(ox-6,oy-6,cw*COLS+12,ch*ROWS+12);
    for(let i=0;i<COLS*ROWS;i++){const x=ox+(i%COLS)*cw,y=oy+Math.floor(i/COLS)*ch;c.fillStyle=grid[i]===1?"#C3CCD1":grid[i]>=2?"#BFE6DA":"#FFFFFF";c.fillRect(x+2,y+2,cw-4,ch-4);
      if(grid[i]===1){c.font="22px sans-serif";c.fillText("🧍",x+cw/2-11,y+ch/2+8);}}
    c.font="26px sans-serif";for(const q of placed)c.fillText(q.p.e,ox+(q.x+q.pw/2)*cw-13,oy+(q.y+q.ph/2)*ch+9);
    return idx>=pieces.length;
  },()=>{S.mini=null;if(idx>=pieces.length){unlock("commute");toast("🚐 Втиснулся! Приехал вовремя.");}else{S.late=true;toast("🚐 Маршрутка уехала. Опоздание: оплата −15%");}
    S.phase="work";render();});
}

function queueGame(){

    <div class="hud"><span id="tm">--</span><span id="sc"></span></div><canvas id="cv"></canvas></div>`;
  const cv=$("#cv"),{c,w,h}=setupCanvas(cv,.85),sp=speedMul("queue");
  let pos=8,cut=[],nextCut=1,nextAdv=1.5,t=0,joke=rnd(WINDOW_JOKES),blocked=0;
  const gap=Math.min(32,(w-110)/11),slotX=i=>w-72-i*gap,qy=h*.7;
  cv.onpointerdown=e=>{e.preventDefault();const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    for(const k of cut)if(!k.done&&Math.hypot(k.x-x,k.y-y)<46){k.done=1;blocked++;Snd.click(1);joke="Билибиджон: «Я тут стоял!»";return;}};
  timer(16,tt=>{t=tt;
    if(t>nextAdv&&pos>0){pos--;nextAdv=t+1.5;Snd.step();}
    if(t>nextCut&&pos>1){const sx=20+Math.random()*(w-130);cut.push({sx,sy:24,x:sx,y:24,t0:t,dur:1.4/sp});nextCut=t+1.1+Math.random()*1.2;}
    for(const k of cut){if(k.done)continue;const p=(t-k.t0)/k.dur,tx=slotX(Math.max(0,pos-1));k.x=k.sx+(tx-k.sx)*p;k.y=k.sy+(qy-k.sy)*p;
      if(p>=1){k.done=1;pos=Math.min(10,pos+1);Snd.fail();vib(50);joke="«Я только спросить!» — и встал перед тобой.";}}
    cut=cut.filter(k=>!k.done);$("#sc").textContent="перед тобой: "+pos;
    c.fillStyle=css("--surface");c.fillRect(0,0,w,h);c.fillStyle=css("--grout");c.fillRect(0,qy+18,w,h);
    c.fillStyle="#9FD3F2";c.fillRect(w-54,qy-70,44,60);c.strokeStyle=css("--ink");c.lineWidth=3;c.strokeRect(w-54,qy-70,44,60);
    c.fillStyle=css("--ink");c.font="500 12px BiliBody,Rubik,sans-serif";c.fillText("Окно 3",w-54,qy-76);
    c.font="26px sans-serif";c.textAlign="center";
    for(let i=0;i<pos;i++)c.fillText("🧍",slotX(i),qy+10);
    c.fillText("👷",slotX(pos),qy+10);for(let i=pos+1;i<pos+4;i++)c.fillText("🧍",slotX(i),qy+10);
    for(const k of cut)c.fillText("🙋",k.x,k.y+10);c.textAlign="start";
    c.fillStyle=css("--ink");c.font="500 15px BiliBody,Rubik,sans-serif";c.fillText(joke,12,22);
    return pos===0;
  },()=>{const q=clamp(1-pos/8,0,1),M=S.mig;M.queued=true;M.windows=q>=.7?3:q>=.4?2:1;if(pos===0&&blocked>=3)unlock("window3");
    M.log.unshift(pos===0?`Дошёл до окна! Отбил ${blocked} «только спросить». Окон сегодня: ${M.windows}.`:`Окно закрылось на «технический перерыв». Успеешь только в ${M.windows} ${M.windows===1?"окно":"окна"}.`);render();});
}

  $("#screen").innerHTML=`<div class="panel"><h1>${t[0]}</h1><div class="tape"></div>${S.over==="win"?`<div class="house">${house(5)}</div>`:`<div class="hero">${sprite("sad")}</div>`}<p>${t[1]}</p>
