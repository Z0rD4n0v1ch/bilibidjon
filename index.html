/* ---------- файл сохранения и защита от очистки ---------- */
let persisted=false;
function askPersist(){try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persisted=!!p;}).catch(()=>{});}}catch(e){}}
function needBackup(){return S.day>=4&&S.day-(S.lastBackup||0)>=5&&S.day>=(S.backupSnooze||0);}
function parseSave(txt){txt=String(txt).trim();let d;try{d=JSON.parse(txt);}catch(e){d=JSON.parse(decodeURIComponent(escape(atob(txt))));}
  if(d&&d.game==="bilibidjon")d=d.state;if(!d||typeof d.day!=="number")throw new Error("bad save");return d;}
function applySave(d){const set=S.settings;S=Object.assign(fresh(),d);S.settings=set;S.stats=Object.assign(fresh().stats,S.stats||{});S.eve=S.eve||{};S.xp=S.xp||{};S.ach=S.ach||[];S.docs=Object.assign(fresh().docs,S.docs||{});S.phone=Object.assign(fresh().phone,S.phone||{});S.blog=Object.assign(fresh().blog,S.blog||{});S.look=Object.assign(fresh().look,S.look||{});S.reviews=S.reviews||[];S.codes=S.codes||[];S.crew=Object.assign(fresh().crew,S.crew||{});S.sergey=Object.assign(fresh().sergey,S.sergey||{});if(S.phase==="mini"){S.phase=S.mini&&S.mini.kind==="commute"?"morning":"evening";S.mini=null;}if(S.phase==="commission"&&!S.com)S.phase="evening";
  if(S.phase==="work")S.phase="morning";if(S.phase==="migration"&&!S.mig)S.mig={queued:false,windows:0,log:[],sub:null};closeDialog();save();toast("Игра загружена!");Snd.fanfare();render();}
async function exportFile(){
  askPersist();
  const name=`bilibidjon-save-den-${S.day}.json`,data=JSON.stringify({game:"bilibidjon",version:APP_VERSION,saved:new Date().toISOString(),state:S},null,1);
  try{
    const file=new File([data],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:"Сохранение Билибиджона"});}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
    S.lastBackup=S.day;save();toast("💾 Сохранение готово");Snd.coin();
  }catch(e){if(e&&e.name==="AbortError")return;toast("Файл не сохранился. Используй код сохранения.");Snd.fail();}
}
function importFile(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json,text/plain";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;let d;
    try{d=parseSave(await f.text());}catch(e){toast("Это не сохранение Билибиджона.");Snd.fail();return;}
    showDialog("Загрузить сохранение?",`<p>В файле: день ${d.day}, отправлено домой ${d.sent||0}₽, ачивок ${(d.ach||[]).length}.</p><p class="log">Текущий прогресс заменится.</p>`,
      [["Загрузить",()=>applySave(d)],["Отмена",closeDialog]]);};
  inp.click();
}

/* ================= ОБНОВЛЕНИЯ ================= */
// Состояния: downloading (идёт скачивание, есть %) → ready (можно ставить) → installing (шаги установки) → перезапуск.
let upd={state:null,p:0,info:{version:"",notes:""},worker:null,step:0},updateDismissed=false,reloading=false;
const CapLN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
const CapBR=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BackgroundRunner;
const BR_LABEL="com.z0rd4n0v1ch.bilibidjon.check";
const canNotify=()=>!!CapLN||("Notification" in window&&"serviceWorker" in navigator&&location.protocol!=="file:");
async function fetchInfo(){try{const i=await (await fetch("version.json?t="+Date.now(),{cache:"no-store"})).json();if(i&&i.version)upd.info=i;}catch(e){}}
function notifyUpdate(){
  if(!S.settings.notify)return;
  const title=`Билибиджон ${upd.info.version||""} готов к установке 🧱`,body=upd.info.notes||"Открой игру и нажми «Установить».";
  if(CapLN){CapLN.schedule({notifications:[{id:1002,title,body}]}).catch(()=>{});return;}
  if("Notification" in window&&Notification.permission==="granted"&&navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:"icon-192.png",badge:"icon-192.png",tag:"bili-update"})).catch(()=>{});
}
function syncRunner(){if(CapBR)CapBR.dispatchEvent({label:BR_LABEL,event:"syncVersion",details:{version:APP_VERSION,notify:!!S.settings.notify}}).catch(()=>{});}
async function toggleNotify(){
  const st=S.settings;st.notifyAsked=true;
  if(st.notify){st.notify=false;save();syncRunner();toast("🔕 Уведомления выключены");return dialogOpen?openSettings():render();}
  let ok=false;
  try{
    if(CapLN){const r=await CapLN.requestPermissions();ok=r.display==="granted";if(ok&&CapBR)await CapBR.requestPermissions({apis:["notifications"]}).catch(()=>{});}
    else ok=(await Notification.requestPermission())==="granted";
  }catch(e){}
  st.notify=ok;save();syncRunner();
  toast(ok?"🔔 Сообщу, когда выйдет новая версия":"Уведомления запрещены в настройках телефона");
  dialogOpen?openSettings():render();
}
function notifyCard(){
  if(!canNotify()||S.settings.notifyAsked||S.settings.notify||!(CapLN||standalone))return "";
  return `<div class="panel"><div class="who">Обновления</div><p>🔔 Присылать уведомление, когда выходит новая версия Билибиджона?</p>
    <div class="row"><button class="main" id="nfYes">Да</button><button id="nfNo">Не надо</button></div></div>`;
}
function showUpdate(){
  let d=$("#upd");
  const hide=!upd.state||(upd.state==="ready"&&updateDismissed)||(upd.state!=="installing"&&(S.phase==="work"||S.phase==="mini"||dialogOpen));
  if(hide){if(d)d.remove();return;}
  const v=upd.info.version&&upd.info.version!==APP_VERSION?" v"+esc(upd.info.version):"",pct=Math.round(upd.p*100);
  let body="";
  if(upd.state==="downloading")body=`<h2>🆕 Новая версия${v}</h2>${upd.info.notes?`<p class="log">${esc(upd.info.notes)}</p>`:""}
    <p>Скачиваю… <b>${pct}%</b></p><div class="bar big"><i style="width:${pct}%"></i></div><p class="log">Можно играть дальше — скачивание идёт в фоне.</p>`;
  else if(upd.state==="ready")body=`<h2>✅ Обновление${v} скачано</h2>${upd.info.notes?`<p>${esc(upd.info.notes)}</p>`:""}
    <div class="bar big"><i style="width:100%"></i></div><p class="log">Установка займёт пару секунд, прогресс сохранится.</p><button class="main" id="updGo">Установить</button><button id="updLater">Позже</button>`;
  else if(upd.state==="installing"){const steps=["Сохраняю прогресс","Переключаюсь на новую версию","Удаляю старую версию","Перезапускаю игру"],s=Math.min(upd.step,3);
    body=`<h2>⚙️ Устанавливаю${v}</h2><p>Шаг ${s+1} из 4: ${steps[s]}…</p><div class="bar big"><i style="width:${Math.round((s+1)/4*100)}%"></i></div>`;}
  else if(upd.state==="error")body=`<h2>⚠️ Обновление не скачалось</h2><p class="log">Попробую ещё раз, когда будет интернет.</p><button id="updLater">Ок</button>`;
  if(!d){d=document.createElement("div");d.id="upd";d.className="upd";document.body.appendChild(d);}
  d.innerHTML=`<div class="panel" role="status" aria-live="polite">${body}</div>`;
  const go=$("#updGo");if(go)go.onclick=installUpdate;
  const lt=$("#updLater");if(lt)lt.onclick=()=>{if(upd.state==="error")upd.state=null;else updateDismissed=true;d.remove();};
}
async function checkUpdatesNow(){
  closeDialog();
  if(!("serviceWorker" in navigator)||location.protocol==="file:")return toast("Обновления работают только в установленной игре");
  toast("🔄 Проверяю…");
  try{const r=await navigator.serviceWorker.getRegistration();if(!r)return toast("Проверка недоступна, перезапусти игру");
    await r.update();
    if(r.installing||r.waiting||upd.state)toast("🆕 Нашлась новая версия — скачиваю!");
    else{await fetchInfo();const newer=upd.info.version&&cmpVer(upd.info.version,APP_VERSION)>0;
      toast(newer?`На сайте ${upd.info.version}, у тебя ${APP_VERSION} — обновляю…`:`✅ У тебя последняя версия ${APP_VERSION}`);
      if(newer)setTimeout(()=>{if(!upd.state||upd.state==="error")hardUpdate();},5000);}
  }catch(e){toast("Нет связи с сайтом. Проверь интернет");}
}
// Запасной путь: если обычное обновление по какой-то причине не стартовало,
// сравниваем версию с сайтом и переустанавливаем игру начисто (сохранения не трогаем).
function cmpVer(a,b){const x=String(a).split(".").map(Number),y=String(b).split(".").map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;}
async function fallbackCheck(){
  if(!("serviceWorker" in navigator)||location.protocol==="file:")return;
  await fetchInfo();if(!upd.info.version||cmpVer(upd.info.version,APP_VERSION)<=0||upd.state)return;
  try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update();}catch(e){}
  setTimeout(()=>{if(!upd.state||upd.state==="error")hardUpdate();},20000);
}
async function hardUpdate(){
  save();upd.state="installing";upd.step=1;showUpdate();
  try{localStorage.setItem("bili_updated","1");}catch(e){}
  try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();}catch(e){}
  upd.step=2;showUpdate();
  try{for(const k of await caches.keys())if(k.startsWith("bili-"))await caches.delete(k);}catch(e){}
  upd.step=3;showUpdate();reloading=true;
  setTimeout(()=>location.replace(location.pathname+"?v="+encodeURIComponent(upd.info.version||Date.now())),500);
}
function repairGame(){showDialog("🧹 Починить игру","<p>Игра удалит свою сохранённую копию и заново скачает её с сайта. <b>Прогресс останется.</b></p><p class='log'>Нужен интернет.</p>",
  [["🧹 Починить",()=>{closeDialog();hardUpdate();}],["Отмена",closeDialog]]);}
setTimeout(fallbackCheck,6000);
function installUpdate(){
  if(!upd.worker)return;save();upd.state="installing";upd.step=0;showUpdate();
  try{localStorage.setItem("bili_updated","1");}catch(e){}
  setTimeout(()=>{upd.step=1;showUpdate();upd.worker.postMessage({type:"SKIP_WAITING"});},500);
  setTimeout(()=>{if(!reloading){reloading=true;location.reload();}},8000);
}
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.addEventListener("message",e=>{const m=e.data||{};
    if(!navigator.serviceWorker.controller)return; // первая установка — не обновление
    if(m.type==="SW_PROGRESS"&&(upd.state===null||upd.state==="downloading")&&m.version!==APP_VERSION){upd.state="downloading";upd.p=m.p||0;if(!upd.info.version)upd.info.version=m.version;showUpdate();}
    if(m.type==="SW_ERROR"&&upd.state==="downloading"){upd.state="error";showUpdate();}
    if(m.type==="SW_STEP"&&upd.state==="installing"){upd.step=Math.max(upd.step,m.step);showUpdate();}});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(upd.state==="installing"&&!reloading){upd.step=3;showUpdate();reloading=true;setTimeout(()=>location.reload(),400);}});
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("sw.js");
      const check=()=>reg.update().catch(()=>{});
      if(reg.waiting&&navigator.serviceWorker.controller){upd.state="ready";upd.worker=reg.waiting;fetchInfo().then(()=>{showUpdate();if(document.hidden)notifyUpdate();});}
      reg.addEventListener("updatefound",()=>{const w=reg.installing;if(!w||!navigator.serviceWorker.controller)return;
        upd.state="downloading";upd.p=0;updateDismissed=false;fetchInfo().then(showUpdate);showUpdate();
        w.addEventListener("statechange",()=>{
          if(w.state==="installed"){upd.state="ready";upd.p=1;upd.worker=w;fetchInfo().then(()=>{showUpdate();if(document.hidden)notifyUpdate();});}
          if(w.state==="redundant"&&upd.state==="downloading"){upd.state="error";showUpdate();}});});
      setInterval(check,30*60*1000);
      document.addEventListener("visibilitychange",()=>{if(!document.hidden)check();else if(upd.state==="ready")notifyUpdate();});
      window.addEventListener("online",check);
    }catch(e){/* нет sw.js рядом (например, превью) — игра работает и без обновлений */}
  });
}
try{if(localStorage.getItem("bili_updated")){localStorage.removeItem("bili_updated");setTimeout(()=>{toast("✅ Игра обновлена до версии "+APP_VERSION);Snd.chime();},700);}}catch(e){}
setTimeout(syncRunner,1500);

/* ================= ДИАЛОГИ И КНОПКА «НАЗАД» ================= */
let dialogOpen=false;
function showDialog(title,html,buttons){
  closeDialog(true);dialogOpen=true;paused=true;
  const d=document.createElement("div");d.className="dlg";d.id="dlg";
  d.innerHTML=`<div class="panel" role="dialog" aria-modal="true" style="max-height:85vh;overflow:auto"><h2>${title}</h2>${html?`<div>${html}</div>`:""}${buttons.map((b,i)=>`<button data-b="${i}" class="${i===0?'main':''}">${b[0]}</button>`).join("")}</div>`;
  document.body.appendChild(d);
  d.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>buttons[+el.dataset.b][1]());
  d.querySelector("button").focus();
}
function closeDialog(keep){const d=$("#dlg");if(d)d.remove();dialogOpen=false;if(keep!==true)paused=false;}
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function exitGame(){save();if(CapApp)return CapApp.exitApp();window.removeEventListener("popstate",onPop);history.go(-2);}
function onBack(){
  if(dialogOpen){closeDialog();return;}
  if(S.phase==="work"&&!S.over){
    return showDialog("Пауза","<p>Билибиджон присел на ведро. Бросишь смену — заработок 0₽.</p>",[
      ["Работать дальше",closeDialog],
      ["Бросить смену",()=>{closeDialog();if(stopCurrent)stopCurrent();unlock("runaway");endJob(0,"Билибиджон сбежал со смены. Заказчик до сих пор ищет его по району.");}]]);
  }
  showDialog("Выйти из игры?","<p>Прогресс сохранён. Билибиджон подождёт.</p>",[["Остаться",closeDialog],["Выйти",exitGame]]);
}
function onPop(){history.pushState({bili:1},"");onBack();}
if(CapApp)CapApp.addListener("backButton",onBack);
else if(standalone){history.pushState({bili:1},"");window.addEventListener("popstate",onPop);}
document.addEventListener("keydown",e=>{if(e.key==="Escape")onBack();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.phase==="work"&&!dialogOpen)onBack();save();});

/* ================= iOS И ПК ================= */
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const DESKTOP=matchMedia("(hover:hover) and (pointer:fine)").matches;
// iOS разблокирует звук только по «настоящему» жесту — ловим все виды касаний
["touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{Snd.init();Music.start();},{capture:true,passive:true}));
document.addEventListener("contextmenu",e=>{if(e.target.tagName==="CANVAS")e.preventDefault();});
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("📲 Билибиджон установлен!");});
function installApp(){
  if(installEvt){closeDialog();installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;});return;}
  if(IS_IOS)return showDialog("📲 Установить на iPhone",`<p>1. Нажми <b>«Поделиться»</b> — квадрат со стрелкой внизу Safari.</p><p>2. Выбери <b>«На экран „Домой“»</b>.</p><p>3. Нажми <b>«Добавить»</b>.</p>
    <p class="log">Важно: у установленной игры свои сохранения. Перенеси прогресс через ⚙️ → «💾 Сохранить в файл», а в установленной игре — «📂 Загрузить из файла».</p>`,[["Понятно",()=>{S.settings.iosHint=true;save();closeDialog();render();}]]);
  showDialog("📲 Установить приложение",`<p>В Chrome или Edge нажми значок установки справа в адресной строке или меню ⋮ → «Установить приложение».</p><p class="log">Игра откроется в отдельном окне и будет работать без интернета.</p>`,[["Понятно",closeDialog]]);
}
function iosCard(){
  if(!IS_IOS||standalone||S.settings.iosHint)return "";
  return `<div class="panel"><div class="who">Совет для iPhone</div><p>Добавь Билибиджона на экран «Домой»: игра откроется на весь экран и будет работать без интернета.</p>
    <div class="row"><button class="main" id="iosHow">📲 Как?</button><button id="iosNo">Не надо</button></div></div>`;
}
function keyHint(t){
  if(!DESKTOP)return "";
  const k=["tile","laminate","wallpaper"].includes(t)?"⌨️ Пробел — положить":["courier","mover"].includes(t)?"⌨️ Стрелки ← →":t==="warehouse"?"⌨️ Клавиши 1, 2, 3":"🖱️ Мышью";
  return ` <span class="keys">${k}</span>`;
}
function tapCanvas(fx,fy){
  const cv=$("#cv");if(!cv||!cv.onpointerdown)return;const r=cv.getBoundingClientRect();
  const ev={clientX:r.left+r.width*fx,clientY:r.top+r.height*fy,pointerId:1,pointerType:"mouse",buttons:1,preventDefault(){}};
  try{cv.onpointerdown(ev);}catch(e){}
}
document.addEventListener("keydown",e=>{
  if(dialogOpen||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const ph=S.phase,t=S.job&&S.job.type,tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;
  if(e.code==="Space"){
    if($("#nRoll")){e.preventDefault();$("#nRoll").click();return;}
    if((ph==="work"&&["tile","laminate","wallpaper"].includes(t))||(ph==="result"&&$("#cv"))){e.preventDefault();tapCanvas(.5,.5);}
    return;}
  if(ph==="work"&&["courier","mover"].includes(t)&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();tapCanvas(e.key==="ArrowLeft"?.2:.8,.5);return;}
  if(ph==="work"&&t==="warehouse"&&["1","2","3"].includes(e.key)){e.preventDefault();tapCanvas((+e.key-.5)/3,.93);}
});

/* ================= СТАРТ ================= */
(function(){const old=load()||{};S=Object.assign(fresh(),old);
  if("sound" in old&&!old.settings){S.settings.sound=old.sound;delete S.sound;}
  S.stats=Object.assign(fresh().stats,S.stats||{});S.eve=S.eve||{};if(!old.docs&&old.day>1)S.docGrace=old.day+4;S.docs=Object.assign(fresh().docs,S.docs||{});S.phone=Object.assign(fresh().phone,S.phone||{});S.blog=Object.assign(fresh().blog,S.blog||{});S.look=Object.assign(fresh().look,S.look||{});S.reviews=S.reviews||[];S.codes=S.codes||[];S.crew=Object.assign(fresh().crew,S.crew||{});S.sergey=Object.assign(fresh().sergey,S.sergey||{});if(S.phase==="mini"){S.phase=S.mini&&S.mini.kind==="commute"?"morning":"evening";S.mini=null;}if(S.phase==="commission"&&!S.com)S.phase="evening";if(S.phase==="migration"&&!S.mig)S.mig={queued:false,windows:0,log:[],sub:null};S.xp=S.xp||{};S.ach=S.ach||[];S.mnotes=S.mnotes||[];
  if(S.phase==="work")S.phase="morning";
  if(S.phase==="result"&&S.result&&S.result.valeraDone===undefined){S.result.valeraDone=true;S.result.qDone=true;S.result.dr=0;}
})();
askPersist();
render();
</script>
